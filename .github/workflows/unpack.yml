name: Unpack source

# The source arrived as an archive because the machine that built it could not
# push to this repository directly. This unpacks it into a normal tree, once.
# Workflow files are excluded: the token Actions runs with is not permitted to
# write to .github/workflows, so those are committed separately.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract the archive
        run: |
          mkdir -p /tmp/src
          unzip -q wonder-academy.zip -d /tmp/src
          rm -rf /tmp/src/.github
          cp -a /tmp/src/. ./
          rm -f wonder-academy.zip index.html
          echo "unpacked \$(find . -path ./.git -prune -o -type f -print | wc -l) files"

      - name: Commit the tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack the source tree

          Replaces the archive and the old single-file build with the real
          project: the Azure Functions API, the T-SQL schema, the frontend and
          the full 2026/27 curriculum." || echo "nothing to commit"
          git push
