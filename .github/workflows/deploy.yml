# Ships code changes. Infrastructure lives in infra.yml and is not touched here.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RG: rg-wonder-academy
  SWA_NAME: swa-wonder-academy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Check the SQL before it reaches a child
        run: |
          python3 -m pip install --quiet sqlglot
          npm ci
          node scripts/sqllint.mjs
          node --test 'test/*.test.mjs'

      - name: Build the frontend
        run: npm run build

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Fetched rather than stored: one less secret to rotate, and it cannot
      # drift out of date.
      - name: Fetch the deployment token
        run: |
          TOKEN=$(az staticwebapp secrets list -g $RG -n $SWA_NAME --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          echo "SWA_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Deploy site and API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: "site"
          api_location: "api"
          output_location: ""
          skip_app_build: true
