   ()=>{const rev=pick([500,800,1200,1500]),cost=pick([300,600,900]);return{q:`Revenue ${rev} dhs, costs ${cost} dhs. Profit or loss, and how much?`,a:[String(rev-cost),(rev-cost>=0?'profit ':'loss ')+Math.abs(rev-cost)],why:`${rev} − ${cost} = ${rev-cost} (${rev-cost>=0?'profit':'loss'})`}}
  ];return shuffle(mk).map(f=>f());}
 },
 {t:'reflect',q:'"Marketing is understanding people, not tricking them." Do you agree? Think of an advert that genuinely helped you find something you wanted — and one that tried to trick you. What was the difference?'}
]}
],
k11:[
{id:'m2',em:'🧮',title:'Maths Bridge',blurb:'A guided crossing from Year 6 into Year 7 — negatives, BODMAS, decimals',scenes:[
 {t:'podcast',ep:'Episode 1 · Bridge to Year 7',title:'Numbers Wearing Capes',art:'🌉',lines:[
  {v:'nova',s:'Zed, in September, thousands of Year Sixes walk into secondary school terrified of "big kid maths." Should they be?'},
  {v:'zed',s:'Probably? It sounds so much harder.'},
  {v:'nova',s:'Here is the secret nobody tells them. Year 7 maths is not new maths. It is Year 6 maths... wearing a cape.'},
  {v:'zed',s:'A cape.'},
  {v:'nova',s:'Same numbers. Same adding, same times tables. Just bigger adventures and a few new tricks. Negative numbers? That is just counting, but going below zero, like a lift into the basement.'},
  {v:'zed',s:'Oh. That is way less scary than "negative integers."'},
  {v:'nova',s:'Exactly! Grown-ups gave friendly ideas frightening names. Today we meet three of them — negatives, the order of operations, and decimals — and you will see they are all old friends in costume.'},
  {v:'zed',s:'So I basically already know Year 7 maths?'},
  {v:'nova',s:'You know most of it. Today we just hand out the capes.'}
 ]},
 {t:'chat',label:'Dialogue I · Below zero',script:[
  {m:'Picture a thermometer on a freezing night. It reads 4 degrees. Then it drops... and drops. What happens when it goes past zero? 🦉'},
  {q:'Where do the numbers go?',opts:[
    {x:'They keep going — minus 1, minus 2, minus 3...',r:'Exactly! Numbers don\'t hit a wall at zero — they carry on into <strong>negative</strong> territory. A lift going to basement floors, a freezer, money you owe. Same number line, just extended.',good:true},
    {x:'They stop at zero — that\'s the end',r:'That\'s what zero looks like — but watch a freezer or a winter thermometer: −1, −2, −3... numbers keep going <em>below</em> zero. They\'re called negative numbers, and they\'re just the number line stretching left.'}],scored:true},
  {m:'Here\'s the only rule you need: on the number line, <strong>adding moves you RIGHT</strong>, subtracting moves you LEFT. That\'s it.'},
  {q:'So it\'s −3 degrees and it warms up by 5. Walk it out: start at −3, move 5 to the right...',opts:[
    {x:'2 degrees',r:'You walked it perfectly: −3 → −2 → −1 → 0 → 1 → 2. You didn\'t need a rule to memorise — you just <em>moved along the line</em>. That\'s the whole trick to negatives.',good:true},
    {x:'−8 degrees',r:'Careful — warming up means moving RIGHT (adding). You went left! Start at −3 and hop 5 steps right: −2, −1, 0, 1, 2. Warmer, not colder. 🌡️'},
    {x:'8 degrees',r:'Close counting, wrong start! Begin AT −3 (not 0) and step 5 right: −2, −1, 0, 1, 2. Lands on 2. The starting point matters as much as the jump.'}],scored:true},
  {probe:'Explain to me, like I\'m a Year 5 who\'s never heard of negative numbers, what −2 means using something from real life.',r:'Teaching someone else is the ultimate test of understanding — and you just passed it. That answer is going to your grown-up. On to the traffic rules of maths! 🚦'}
 ]},
 {t:'chat',label:'Dialogue II · The maths traffic rules',script:[
  {m:'A question that starts fights on the internet: what is <strong>2 + 3 × 4</strong>? Answer from the gut.'},
  {q:'Gut answer:',opts:[
    {x:'20 — left to right, easy',r:'That\'s the internet\'s favourite wrong answer! Maths has traffic rules called <strong>BODMAS</strong> — and multiplication goes BEFORE addition. So 3×4=12 first, then +2 = 14. Let me show you why the rule has to exist...',},
    {x:'14 — I think you multiply first?',r:'Look at you, already sensing the rule! Multiplication jumps the queue: 3×4=12, then +2 = <strong>14</strong>. It\'s called BODMAS. But here\'s the real question — <em>why</em> should multiplication get to go first?',good:true}],scored:true},
  {q:'Why do we need an agreed order at all? Imagine if everyone did it their own way...',opts:[
    {x:'So everyone gets the SAME answer — maths must mean one thing',r:'That\'s the heart of it. If 2+3×4 meant different things to different people, maths would be useless — you couldn\'t trust a recipe, a price, or a bridge calculation. BODMAS makes maths a language everyone reads identically.',good:true},
    {x:'Because teachers like rules',r:'Ha — it feels that way! But imagine building a rocket where half the team reads the formula one way and half another. 💥 The order exists so a sum means <em>exactly one thing</em> to every human on Earth. That\'s power, not fuss.'}],scored:true},
  {q:'Now YOU take control. How would you force the addition to happen first in 2 + 3 × 4?',opts:[
    {x:'Put brackets round it: (2 + 3) × 4 = 20',r:'Brilliant — brackets are you <em>overruling</em> the traffic. (2+3)×4 = 5×4 = 20. Same symbols, different answer, and YOU decided. The B in BODMAS stands for the boss: Brackets.',good:true},
    {x:'You can\'t change it',r:'You can — with the most powerful tool in maths: <strong>brackets</strong>. (2+3)×4 forces the addition first: 5×4 = 20. Brackets let you overrule the traffic rules whenever you choose. Try it!'}],scored:true},
  {probe:'Write your own sum where adding brackets changes the answer. Show me both versions and both answers.',r:'You just wrote a maths question instead of only answering one — that\'s a Year 7 mind at work. Saved for your grown-up! 🎒'}
 ]},
 {t:'quickfire',label:'The Crossing · prove your footing',n:6,gen:()=>genMaths11(6),
  intro:'Time to cross the bridge yourself — no hand-holding. Six challenges, fresh every visit. You\'ve got this.'},
 {t:'reflect',q:'You learned three "scary" ideas were really old friends in disguise (negatives, BODMAS, decimals). Can you think of something else in life that seemed scary until someone explained it simply? What made the difference?'}
]},
{id:'w2',em:'🪄',title:'Word Wizard',blurb:'Spelling spells and sparkling vocabulary — a conversation about the magic of words',scenes:[
 {t:'podcast',ep:'Episode 2 · Bridge to Year 7',title:'Why It\'s Called Spelling',art:'🪄',lines:[
  {v:'nova',s:'Zed, has it ever struck you that we call it SPELLING? Like a wizard casts a spell?'},
  {v:'zed',s:'Huh. I never thought about that. Is that a coincidence?'},
  {v:'nova',s:'Not entirely. Long ago, words were believed to hold real power. To know the true name of a thing was to have power over it. And honestly? That is still true.'},
  {v:'zed',s:'How is it still true? Words are just... words.'},
  {v:'nova',s:'Are they? In Year 7 you will write for eight different teachers. The pupil who can say majestic instead of nice, or ponder instead of think, gets noticed. The right word at the right moment changes what people think of you.'},
  {v:'zed',s:'So a good vocabulary is like... a wand.'},
  {v:'nova',s:'A wand you carry into every classroom, every friendship, every argument, for the rest of your life. And spelling is just learning to cast the spell correctly.'},
  {v:'zed',s:'Okay, teach me some spells.'},
  {v:'nova',s:'Today: how to make impossible words stick using silly stories, and five words that will make your teachers look twice. Wands out.'}
 ]},
 {t:'chat',label:'Dialogue I · Silly makes it stick',script:[
  {m:'Let\'s test how memory really works. I\'ll give you two ways to remember that "category" has a hidden word in it. 🦉'},
  {m:'Way one: "just memorise c-a-t-e-g-o-r-y." Way two: "there\'s a <strong>CAT</strong> in every catEGORY — picture a cat sorting things into boxes." 🐱'},
  {q:'Which one will you still remember next week — and why?',opts:[
    {x:'The cat — because I can SEE it, and silly things stick',r:'You just discovered how memory actually works. Your brain treats plain letters as boring and forgets them, but a vivid silly image? It refuses to let go. That\'s not a trick — that\'s the science of memory.',good:true},
    {x:'The plain letters — less distracting',r:'Try this: don\'t think about a cat sorting things into boxes. 🐱 ...You just did, didn\'t you? That\'s the point — vivid, silly images <em>stick</em> whether you want them to or not. Plain letters slip away. Use the cat.'}],scored:true},
  {q:'Let\'s make one together. "community" needs a double M. Which story would YOU remember?',opts:[
    {x:'A coMMunity has Many Members — two Ms for many people',r:'That\'s a keeper — you built a bridge between the double-M and the <em>meaning</em> (lots of people). The best mnemonics connect to what the word actually means. You\'re thinking like a proper word wizard.',good:true},
    {x:'Just remember two Ms',r:'That works for about an hour! Give it a story instead: a <strong>coMMunity</strong> has <strong>M</strong>any <strong>M</strong>embers — two Ms for the many people. Now the spelling and the meaning hold hands, and neither escapes.'}],scored:true},
  {probe:'Invent your own silly memory story for the word "ancient" (a-n-c-i-e-n-t). Make me smile.',r:'Saved to your spellbook! Here\'s the wizard\'s secret: a mnemonic YOU invent beats any I could give you, because your brain built it. Now let\'s cast some spells for real. ✨'}
 ]},
 {t:'spellrun',label:'The Spellbook · cast six spells',n:6,list:'SPELL11',
  intro:'Wand ready. I\'ll speak each word aloud — you cast it letter by letter. Different spells each visit. Listen closely...'},
 {t:'chat',label:'Dialogue II · Ordinary words into gold',script:[
  {m:'Final magic. Two sentences describing the exact same castle:<br><br>1. "The castle was old and nice."<br>2. "The <strong>ancient</strong> castle looked <strong>majestic</strong> against the sky."'},
  {q:'Same castle. What did the second writer\'s word-choice actually DO?',opts:[
    {x:'It let me picture it — old became ancient, nice became majestic',r:'Precisely. "Nice" is a grey word — it could mean anything. "Majestic" paints a picture in the reader\'s mind. Powerful words don\'t just describe; they make the reader <em>see</em>.',good:true},
    {x:'It used longer words to show off',r:'It might look like showing off — but read them again. "Nice" tells you almost nothing; "majestic" makes you <em>see</em> towers against the sky. Precise words aren\'t decoration — they hand the reader a picture.'}],scored:true},
  {m:'Try one on: "ponder" means to think about something slowly and deeply. Not a quick thought — a proper, chin-stroking think. 🤔'},
  {q:'Which sentence uses "ponder" like a true word wizard?',opts:[
    {x:'"She sat by the window to ponder the strange riddle."',r:'Perfect casting — slow, thoughtful, deep. That\'s exactly the flavour "ponder" carries. You\'re not just learning words, you\'re learning their <em>mood</em>.',good:true},
    {x:'"He pondered his shoelace quickly and ran off."',r:'Not quite — "ponder" is slow and deep, so "quickly" fights against it. You\'d <em>ponder</em> a mystery, not a shoelace on the run! Words have moods; match them. Try the window sentence.'}],scored:true},
  {probe:'Write one sentence about your summer using at least TWO wizard words: vivid, majestic, ponder, reluctant, genuine, fragile.',r:'A sentence worth framing! Every sparkling word you own is a new colour in your paintbox. Keep collecting them — a rich vocabulary is the one kind of treasure nobody can ever take from you. 💎'}
 ]},
 {t:'reflect',q:'If words really are like spells that change how people see you, is it fair that some children know more words than others? What could you do to help a friend build their word-magic too?'}
]},
{id:'s2',em:'🔬',title:'The Tiny Machines',blurb:'A journey inside a single cell — your Year 7 science preview',scenes:[
 {t:'podcast',ep:'Episode 3 · Bridge to Year 7',title:'37 Trillion Machines',art:'🔬',lines:[
  {v:'nova',s:'Zed, hold up your hand. Look at it. What is it made of?'},
  {v:'zed',s:'Skin? Bones? I don\'t know — hand stuff.'},
  {v:'nova',s:'Zoom in. Closer. Closer than your eye can go. Your hand is built from tiny living units called cells. And there are about thirty seven TRILLION of them in you.'},
  {v:'zed',s:'Thirty seven trillion? In just... me?'},
  {v:'nova',s:'In just you. And every single one is a working machine — eating, breathing, building, repairing itself, right now as we speak. You are a galaxy of tiny machines that somehow adds up to a person who tells jokes.'},
  {v:'zed',s:'That is completely bananas. Is everything made of cells?'},
  {v:'nova',s:'Every living thing. The oak tree outside. The bacteria on your shoe. A blue whale. All of it — cells. It is the first great idea of biology, and it is the first thing you meet in Year 7.'},
  {v:'zed',s:'So if I understand cells, I basically walk into Year 7 science already ahead?'},
  {v:'nova',s:'Miles ahead. So let us take a walk... inside one.'}
 ]},
 {t:'chat',label:'Dialogue I · The cell is a city',script:[
  {m:'Let\'s explore one cell together. I find it helps to imagine it as a tiny city. 🦉 Every city needs a place where the big decisions are made and the master plans are kept. What do we call that in a town?'},
  {q:'The building that runs the town:',opts:[
    {x:'The town hall — the control centre',r:'Perfect. In a cell, that\'s the <strong>nucleus</strong> — it holds the DNA (the master instructions) and controls everything the cell does. Town hall of the cell. Hold that picture.',good:true},
    {x:'The library',r:'Close — a library <em>stores</em> things, and the nucleus does store the DNA plans. But it also <em>runs</em> everything, like a town hall giving orders. The <strong>nucleus</strong> is the cell\'s control centre.'}],scored:true},
  {m:'Every city needs power stations, or nothing runs. In a cell, tiny structures called <strong>mitochondria</strong> release energy from your food. 🔋'},
  {q:'Reason it out: when you sprint, which cells must be STUFFED with mitochondria?',opts:[
    {x:'Muscle cells — they burn the most energy',r:'Exactly the deduction a biologist makes! Muscle cells are packed with mitochondria because they demand huge energy. Structure follows need — remember that idea, it runs through all of biology.',good:true},
    {x:'Hair cells — hair is everywhere',r:'Think about which cells are working hardest when you sprint — is it your hair, or your <em>muscles</em>? Muscle cells burn enormous energy, so they\'re crammed with power stations (mitochondria). Structure follows the job.'}],scored:true},
  {q:'A cell also needs a wall to control what comes in and out — the <strong>cell membrane</strong>. Why would a cell need a gatekeeper at all?',opts:[
    {x:'To let in food and keep out harmful things — control',r:'Just like a city gate. Without control over what enters and leaves, the cell couldn\'t survive. Every part you\'re meeting has a <em>job</em> — nothing in biology is there by accident.',good:true},
    {x:'Just for decoration',r:'Nothing in a living thing is just decoration — that\'s a great rule to carry into Year 7. The membrane is a <strong>gatekeeper</strong>: food in, waste out, dangers blocked. Control is survival.'}],scored:true},
  {probe:'Describe the cell-as-a-city in your own words: what\'s the town hall, and what are the power stations, and what do they each do?',r:'You just gave your first biology explanation — in your own words, which is the only kind that counts. Saved for your grown-up. Now... plants have some upgrades you don\'t. 🌿'}
 ]},
 {t:'chat',label:'Dialogue II · The plant\'s superpower',script:[
  {m:'Here\'s a puzzle. You get hungry and must find food. A sunflower just... stands in a field all day and never starves. How? 🌻'},
  {q:'What can a plant do that you absolutely cannot?',opts:[
    {x:'Make its own food from sunlight',r:'Yes! It\'s called <strong>photosynthesis</strong>, and it\'s one of the most important tricks in the universe — it feeds nearly all life and makes the oxygen you\'re breathing. But <em>how</em> does a plant catch sunlight? It has special equipment you don\'t...',good:true},
    {x:'Nothing — it\'s secretly eating soil',r:'A common idea — but soil is mostly for water and minerals, not food! The plant does something astonishing: it makes food from <em>sunlight</em>. It\'s called photosynthesis, and it needs special kit that your cells don\'t have...'}],scored:true},
  {q:'Plant cells contain tiny green solar panels that catch light. Given they make plants green... what might they be called?',opts:[
    {x:'Chloroplasts — "chloro" means green',r:'Detective work! <strong>Chloroplasts</strong> — packed with green chlorophyll that captures sunlight. Your cells have none, which is exactly why you can\'t photosynthesise your way out of eating lunch. 😄',good:true},
    {x:'Mitochondria',r:'Careful — mitochondria <em>release</em> energy from food (both plants and you have those). The green solar panels that <em>capture</em> sunlight are <strong>chloroplasts</strong> — "chloro" literally means green. Plants only.'}],scored:true},
  {q:'Now think like a scientist with a mystery cell under your microscope: it has a rigid cell wall AND green chloroplasts. Your verdict?',opts:[
    {x:'Plant cell — the wall and chloroplasts give it away',r:'Case closed, detective. Cell wall + chloroplasts = plant, every time. That\'s real science: you didn\'t guess, you read the <strong>evidence</strong>. Exactly how Year 7 will ask you to think.',good:true},
    {x:'Animal cell',r:'Check your evidence again: animal cells never have a cell wall OR chloroplasts. Both present? It must be a <strong>plant</strong> cell. In science, the evidence decides — not the hunch.'}],scored:true},
  {probe:'A friend claims "plants aren\'t really alive — they don\'t even move." Using what you now know about what plant cells DO, argue back with evidence.',r:'You just used evidence to overturn a wrong idea — that\'s the entire job of a scientist. Plants breathe, eat, grow, reproduce and respond — bursting with life. Brilliant thinking, saved for your grown-up. 🔬'}
 ]},
 {t:'reflect',q:'You are 37 trillion tiny machines that somehow work together as one "you". Does that change how you think about yourself at all? There\'s no right answer — I\'m curious what you think.'}
]},
{id:'d2',em:'🕵️',title:'Think Like a Detective',blurb:'The most important Year 7 skill: telling truth from trickery',scenes:[
 {t:'podcast',ep:'Episode 4 · Bridge to Year 7',title:'The Detective\'s Code',art:'🕵️',lines:[
  {v:'nova',s:'Zed, secondary school is about to pour thousands of facts into your head. But I want to teach you the one skill more valuable than any fact.'},
  {v:'zed',s:'More valuable than facts? What could that be?'},
  {v:'nova',s:'Knowing which facts to believe. The internet will tell you a hundred things today, and some of them are lies wearing very convincing costumes.'},
  {v:'zed',s:'So how do you tell the real ones from the fakes?'},
  {v:'nova',s:'You become a detective. And every good detective lives by one rule: follow the evidence, not the loudest voice. Not the most popular voice. Not the most famous voice. The evidence.'},
  {v:'zed',s:'But loads of stuff online has millions of likes. Doesn\'t that make it true?'},
  {v:'nova',s:'Ah. Once, almost everybody on Earth was certain the world was flat. Millions agreed. Were they right?'},
  {v:'zed',s:'...No. So being popular and being true are different things.'},
  {v:'nova',s:'That single realisation will protect you your whole life. Today I teach you the three tricks that fool people — so that they can never fool you.'},
  {v:'zed',s:'Detective mode: on.'}
 ]},
 {t:'chat',label:'Dialogue I · Facts, opinions, and costumes',script:[
  {m:'First, a detective must tell facts from opinions. Two statements: 🦉<br><br>A) "The Nile is over 6,000 km long."<br>B) "The Nile is the most beautiful river on Earth."'},
  {q:'What\'s the key difference between them?',opts:[
    {x:'A can be checked and proven; B is a personal view',r:'Exactly — a <strong>fact</strong> can be tested against reality; an <strong>opinion</strong> is how someone feels. Neither is bad! But a detective must always know which one they\'re looking at.',good:true},
    {x:'A is boring, B is interesting',r:'Ha — B might be more fun! But that\'s not the difference that matters. A is a <strong>fact</strong> (measurable, checkable); B is an <strong>opinion</strong> (a feeling). Mixing them up is how people get fooled.'}],scored:true},
  {m:'Now the dangerous kind — opinions in disguise. Someone says: "<em>Obviously</em>, football is the greatest sport ever invented." 🎭'},
  {q:'What\'s the costume, and what\'s underneath?',opts:[
    {x:'"Obviously" and "greatest" dress an opinion up as a fact',r:'Sharp eyes, detective! "Greatest" can\'t be measured, and "obviously" is there to <em>pressure</em> you into agreeing without evidence. Watch for costume-words: obviously, everyone knows, clearly. They\'re usually hiding an opinion.',good:true},
    {x:'It\'s a fact — football is popular',r:'Football\'s popularity IS a fact — but "the GREATEST sport ever" is a matter of taste, not measurement. The word "obviously" is a costume, pressuring you to agree. Underneath the disguise? Pure opinion.'}],scored:true},
  {probe:'Write me one FACT and one OPINION about your favourite hobby. Label which is which.',r:'A detective who can tell them apart at will — that\'s exactly the skill that keeps you from being fooled. Filed away. Now, the three tricks... 🔍'}
 ]},
 {t:'chat',label:'Dialogue II · The three tricks',script:[
  {m:'An advert declares: "Join <strong>millions</strong> of happy customers!" 📢 They want the crowd to convince you.'},
  {q:'What\'s the flaw in "millions agree, so it must be good"?',opts:[
    {x:'Popularity isn\'t proof — millions can be wrong',r:'You remembered the flat-Earth! This trick is called the <strong>bandwagon</strong> — pointing at a crowd instead of showing evidence. Ask: never mind who ELSE bought it, is it actually any good?',good:true},
    {x:'Nothing — millions is a lot',r:'Remember the flat Earth — millions were certain, and wrong! A crowd is not evidence. This trick has a name: the <strong>bandwagon</strong>. Real proof shows you the thing itself, not a headcount of fans.'}],scored:true},
  {q:'Trick two: a famous footballer appears in an advert saying "As a champion, I recommend this brain-boosting vitamin!" What should a detective ask?',opts:[
    {x:'"Is a footballer actually an expert on vitamins and brains?"',r:'The <strong>false expert</strong> trick, exposed! Being brilliant at football says nothing about medicine. Fame in one field is not knowledge in another. Ask instead: what do actual <em>scientists</em> say?',good:true},
    {x:'"How many goals has he scored?"',r:'Fun question, wrong one! His goals don\'t make him a doctor. This is the <strong>false expert</strong> trick — borrowing fame from one field to sell something in another. The real question: are footballers experts on <em>vitamins</em>? No.'}],scored:true},
  {q:'Trick three: a game advert says "9 out of 10 kids at our office loved it!" Spot the sleight of hand.',opts:[
    {x:'Ten kids at ONE office isn\'t proof about all kids — they picked a tiny friendly sample',r:'That\'s <strong>cherry-picking</strong> — choosing only the evidence that suits you and hiding the rest. A detective always asks: how many people, chosen how, and what did they leave out?',good:true},
    {x:'9 out of 10 is a great score',r:'It sounds great — but nine out of <em>ten</em>? At their <em>own office</em>? They picked a tiny, friendly crowd and hid everyone else. That\'s <strong>cherry-picking</strong>. Always ask: how many, chosen how, and what\'s hidden?'}],scored:true},
  {probe:'Now YOU be the trickster — then unmask yourself. Invent a sneaky advert for a made-up product using ONE of the three tricks (bandwagon, false expert, or cherry-picking), then explain which trick you used and how a detective would catch it.',r:'Inventing the trick yourself is how you become permanently immune to it — you\'ll spot these everywhere now, for the rest of your life. Detective, you\'re ready. This one\'s going to your grown-up. 🕵️'}
 ]},
 {t:'reflect',q:'You\'ve now got the detective\'s code: follow the evidence, not the loudest voice. Where do you see the three tricks most in your own life — adverts, social media, friends? Which one do you think is the sneakiest, and why?'}
]},
{id:'fr11',em:'🍕',title:'Fraction Power',blurb:'The moment fractions stop being scary — because you finally see what they really are',scenes:[
 {t:'podcast',ep:'Episode 5 · Bridge to Year 7',title:'The Pizza That Explains Everything',art:'🍕',lines:[
  {v:'nova',s:'Zed, why do you think so many people are scared of fractions?'},
  {v:'zed',s:'Because they look weird? One number sitting on top of another, with a line. It feels like a code.'},
  {v:'nova',s:'It IS a code — and it is the easiest code ever, because you already crack it every time you share a pizza.'},
  {v:'zed',s:'How is a pizza a fraction?'},
  {v:'nova',s:'Cut a pizza into 4 equal slices. Take 3. You have three-quarters. The bottom number tells you how many slices the WHOLE was cut into. The top tells you how many you have got. That is the entire code.'},
  {v:'zed',s:'Wait. Bottom is how many pieces in total, top is how many I took. That is... actually really simple.'},
  {v:'nova',s:'Bottom names the size of the slice, top counts them. Once you see that, three-eighths and seven-tenths stop being scary codes and become pizza. Delicious, countable pizza.'},
  {v:'zed',s:'So the fear was just the disguise, not the maths.'},
  {v:'nova',s:'It almost always is. Today, we eat the disguise.'}
 ]},
 {t:'chat',label:'Dialogue · What a fraction really is',script:[
  {m:'Let us lock in the code. 🦉 In the fraction three-quarters, three-over-four: the bottom number (4) tells you the whole was split into 4 equal parts. What does the top number (3) tell you?'},
  {q:'The top number...',opts:[
    {x:'How many of those parts you have — 3 of the 4',r:'Perfect — bottom splits the whole, top counts your share. Now here is a puzzle that catches people out: which is bigger, one-quarter or one-eighth? Bigger bottom number... bigger fraction?',good:true},
    {x:'How big each part is',r:'Close, but flip it: the <em>bottom</em> decides how big each part is (into how many pieces). The <em>top</em> simply <strong>counts</strong> how many of those pieces you have. Three-quarters = 3 pieces out of 4.'}],scored:true},
  {q:'One pizza cut into 4 pieces vs the same pizza cut into 8. Which single slice is BIGGER — a quarter or an eighth?',opts:[
    {x:'A quarter — fewer cuts means bigger slices',r:'Brilliant — and this is the trap that fools everyone: a bigger bottom number means a <em>smaller</em> slice, because you have chopped the pizza into more pieces. So one-eighth is smaller than one-quarter, even though 8 is bigger than 4. Fractions flip your instinct!',good:true},
    {x:'An eighth — 8 is bigger than 4',r:'The famous fraction trap! Picture it: cut a pizza into 8 instead of 4 and each slice gets <em>smaller</em>. A bigger bottom number = more cuts = tinier pieces. So a quarter beats an eighth. The bottom number works backwards from what you expect.'}],scored:true},
  {q:'Why do you think one-half and two-quarters are actually the SAME amount? Picture the pizza.',opts:[
    {x:'Two quarter-slices side by side make exactly half the pizza',r:'Exactly — that is "equivalent fractions". Different-looking fractions can be the same amount, because 2 slices of 4 covers the same pizza as 1 slice of 2. Once you can SEE it, you never need to just memorise it.',good:true},
    {x:'They only look the same by luck',r:'No luck involved — draw it! Two of the four quarter-slices cover exactly the same pizza as one of the two halves. They are <strong>equivalent</strong>: same amount, different clothing. Seeing beats memorising every time.'}],scored:true},
  {probe:'Explain to a Year 5 pupil why one-third is bigger than one-fifth, even though 5 is bigger than 3. Use pizza or chocolate!',r:'Explaining the "bigger bottom, smaller slice" flip in your own words means you truly get it — that trips up whole classrooms. Saved for your grown-up. Now prove it! 🍫'}
 ]},
 {t:'quickfire',label:'The Kitchen · fractions in action',n:6,intro:'Six fraction challenges. Fresh each visit. Type your answer — a number, or a fraction like 3/4.',
  gen:()=>{const mk=[
   ()=>{const w=pick([12,16,20,24,40]),d=pick([2,4]);return{q:`${d===2?'half':'a quarter'} of ${w}`,a:[String(w/d)],why:`${w} ÷ ${d} = ${w/d}`}},
   ()=>{const w=pick([12,15,18,21,24]);return{q:`one third of ${w}`,a:[String(w/3)],why:`${w} ÷ 3 = ${w/3}`}},
   ()=>{const f=pick([['1/2','0.5'],['1/4','0.25'],['3/4','0.75'],['1/5','0.2']]);return{q:`${f[0]} as a decimal`,a:[f[1]],why:`${f[0]} = ${f[1]}`}},
   ()=>{const w=pick([20,40,60,80]);return{q:`three quarters of ${w}`,a:[String(w/4*3)],why:`${w} ÷ 4 = ${w/4}, ×3 = ${w/4*3}`}},
   ()=>{const p=pick([['1/2','2/4'],['1/3','2/6'],['1/4','2/8'],['2/3','4/6']]);return{q:`fill the gap: ${p[0]} is the same as ?/${p[1].split('/')[1]}`,a:[p[1].split('/')[0]],why:`${p[0]} = ${p[1]}`}},
   ()=>{const a=pick([['1/4','1/4','1/2'],['1/3','1/3','2/3'],['1/5','2/5','3/5']]);return{q:`${a[0]} + ${a[1]} = ? (same bottom number)`,a:[a[2]],why:`add the tops, keep the bottom → ${a[2]}`}}
  ];return shuffle(mk).map(f=>f());}
 },
 {t:'reflect',q:'Fractions felt scary until you saw they were just pizza slices. What is something in life that felt complicated until someone showed you the simple idea hiding underneath? What was the "pizza" that made it click?'}
]},
{id:'al11',em:'🔡',title:'The Language of Algebra',blurb:'Year 7\'s big new idea: when letters join the maths, and why it is secretly easy',scenes:[
 {t:'podcast',ep:'Episode 6 · Bridge to Year 7',title:'The Mystery Number Game',art:'🔡',lines:[
  {v:'nova',s:'Zed, let us play a game. Think of a number. Do not tell me. Add 5 to it. Got it?'},
  {v:'zed',s:'Got it.'},
  {v:'nova',s:'I do not know your number. But I can still talk about it. I will call it n. Your answer is n plus 5. See what I just did?'},
  {v:'zed',s:'You gave my secret number a name, even though you do not know what it is.'},
  {v:'nova',s:'That is algebra. The whole thing. A letter is just a nickname for a number we do not know yet, or a number that could be anything.'},
  {v:'zed',s:'That is IT? I thought algebra was this huge scary monster in secondary school.'},
  {v:'nova',s:'The monster is a mouse in a costume. In Year 7 you will see 2n, and 3x plus 1, and it will look alien. But every single time, the letter just means "some number, call it this for now".'},
  {v:'zed',s:'So if I can play the mystery number game, I can do algebra.'},
  {v:'nova',s:'You already are. Today we just learn to write the game down like a mathematician.'}
 ]},
 {t:'chat',label:'Dialogue · Letters are just nicknames',script:[
  {m:'Here is the first thing that confuses people. 🦉 In algebra, <strong>2n</strong> means "2 times n" — the multiply sign is invisible. Why do you think mathematicians hide the × sign next to a letter?'},
  {q:'Best reason:',opts:[
    {x:'Because × looks too much like the letter x — it would get confusing',r:'Exactly! Imagine writing "x × x" — chaos. So mathematicians agreed: a number stuck to a letter <em>always</em> means multiply. 2n = 2 times n = n + n. A tidy trick to avoid a messy clash.',good:true},
    {x:'To make it harder',r:'Never to be cruel! Picture writing "x × x" — the multiply sign and the letter x look almost identical. So the rule is: a number next to a letter means multiply, sign hidden. 2n means 2 × n. Tidiness, not trickery.'}],scored:true},
  {q:'So if n stands for 4, what is 2n? Remember the invisible multiply.',opts:[
    {x:'8 — because 2n means 2 × 4',r:'Spot on. You "substituted" 4 in place of n and multiplied. That word — <strong>substitution</strong> — is a huge part of Year 7 algebra, and you just did it without breaking a sweat.',good:true},
    {x:'24 — put the 2 and 4 together',r:'Tempting, but 2n is not "stick them side by side" — the multiply is hidden there. 2n means 2 × n, and if n = 4, that is 2 × 4 = 8. Swapping the number in for the letter is called <strong>substitution</strong>.'}],scored:true},
  {q:'Now something clever. Why can we simplify <strong>n + n + n</strong> to just <strong>3n</strong>?',opts:[
    {x:'Three lots of the same n is 3 times n — that is what 3n means',r:'Beautiful. "Collecting like terms" is just tidying: three copies of n become 3n, the same way three apples become "3 apples". Algebra is often just organised common sense with a letter attached.',good:true},
    {x:'You cannot — they are different',r:'They are actually all the <em>same</em> n! Three copies of one nickname: n + n + n = 3 lots of n = 3n. It is exactly like "1 apple + 1 apple + 1 apple = 3 apples". Tidying up like this is called collecting like terms.'}],scored:true},
  {probe:'Explain, in your own words, what the letter in an algebra expression actually stands for. Use the "mystery number game" if it helps.',r:'Nailing what the letter <em>means</em> is the thing that carries you through years of algebra — most people never quite get told. Saved for your grown-up. Prove it now! 🎯'}
 ]},
 {t:'quickfire',label:'The Codebreaker · algebra warm-ups',n:6,intro:'Six algebra challenges. Substitute, simplify, solve. Fresh each visit. Type the number (or "3n" style where asked).',
  gen:()=>{const mk=[
   ()=>{const n=R(2,9);return{q:`if n = ${n}, what is 2n?`,a:[String(2*n)],why:`2 × ${n} = ${2*n}`}},
   ()=>{const n=R(2,9),c=R(1,9);return{q:`if n = ${n}, what is n + ${c}?`,a:[String(n+c)],why:`${n} + ${c} = ${n+c}`}},
   ()=>{const n=R(2,7),c=R(1,6);return{q:`if x = ${n}, what is 3x + ${c}?`,a:[String(3*n+c)],why:`3×${n} + ${c} = ${3*n+c}`}},
   ()=>{const a=R(2,5);return{q:`simplify  n + n + n${a>2?' + n':''}`,a:[(a>2?4:3)+'n'],why:`${a>2?4:3} lots of n = ${a>2?4:3}n`}},
   ()=>{const a=R(2,5),b=R(2,5);return{q:`simplify  ${a}n + ${b}n`,a:[(a+b)+'n'],why:`${a}+${b} = ${a+b}, so ${a+b}n`}},
   ()=>{const x=R(3,10),c=R(2,8);return{q:`solve  x + ${c} = ${x+c}`,a:[String(x),'x='+x],why:`take ${c} from both sides → x = ${x}`}}
  ];return shuffle(mk).map(f=>f());}
 },
 {t:'reflect',q:'Algebra lets you talk about a number before you know what it is. Where else in life do we give something a name or a label before we fully understand it? Is that helpful, or can it sometimes fool us?'}
]},
{id:'fo11',em:'🚀',title:'Forces & Motion',blurb:'Year 7 Science: the invisible pushes and pulls that run the entire universe',scenes:[
 {t:'podcast',ep:'Episode 7 · Bridge to Year 7',title:'Why Nothing Ever Really Stops',art:'🚀',lines:[
  {v:'nova',s:'Zed, roll a ball across the floor. It slows down and stops. Why?'},
  {v:'zed',s:'Because... it runs out of energy? Things just stop. That is normal.'},
  {v:'nova',s:'That is what everyone thinks, and it is one of the most famous wrong ideas in history. A ball does not stop because stopping is natural. It stops because something is secretly PUSHING against it.'},
  {v:'zed',s:'Pushing against it? I do not see anything pushing.'},
  {v:'nova',s:'You cannot see it — but it is there. It is called friction. The floor and the air are gripping the ball, slowing it. Take friction away, and the ball would roll forever.'},
  {v:'zed',s:'Forever? That cannot be right.'},
  {v:'nova',s:'In deep space, with nothing to push against, a thrown ball flies in a straight line for a million years. Motion is the natural state. Stopping is what needs explaining.'},
  {v:'zed',s:'So my whole life I have had it backwards.'},
  {v:'nova',s:'Almost everyone does — until a man named Newton flipped it. Today, you see the invisible forces. And once you see them, you cannot unsee them.'}
 ]},
 {t:'chat',label:'Dialogue I · The invisible pushes',script:[
  {m:'A force is simply a push or a pull. 🦉 They are invisible, but you feel their effects constantly. Right now, sitting still, one force is pulling you down toward the Earth. What do we call it?'},
  {q:'The pull toward Earth:',opts:[
    {x:'Gravity',r:'Yes — gravity, pulling you (and everything) toward the centre of the Earth. But here is a puzzle: if gravity is pulling you down right now, why are you not falling through your chair to the ground?',good:true},
    {x:'Wind',r:'Wind pushes sideways and comes and goes — but the force holding you to the Earth acts always, even indoors, even now. It is <strong>gravity</strong>, pulling everything toward the Earth\'s centre. So why aren\'t you falling through your chair?'}],scored:true},
  {q:'Gravity pulls you down, yet you sit still. Reason it out — what must the chair be doing?',opts:[
    {x:'Pushing UP on you, exactly balancing gravity\'s pull down',r:'Brilliant deduction! The chair pushes up just as hard as gravity pulls down. Two equal forces in opposite directions cancel out — "balanced forces" — so you stay still. When forces balance, nothing changes. That is the key rule.',good:true},
    {x:'Nothing — chairs are just solid',r:'It feels passive, but a chair is actively <em>pushing up</em> on you — exactly as hard as gravity pulls down. The two forces cancel ("balanced forces"), so you neither sink nor rise. Balanced forces mean no change in motion.'}],scored:true},
  {q:'So back to the rolling ball. It slows and stops. Using what you now know — what must be happening?',opts:[
    {x:'An unbalanced force (friction) is pushing against it, slowing it down',r:'You reasoned like a physicist! Nothing slows without a force. Friction — the floor and air gripping the ball — is an <em>unbalanced</em> force acting against the motion. Remove it and the ball never stops. You have overturned the "things just stop" myth.',good:true},
    {x:'It naturally runs out of go',r:'That is the ancient myth Newton smashed! Nothing "runs out of go" — something must <em>push</em> against it. That something is <strong>friction</strong> (floor + air), an unbalanced force. In space, with no friction, the ball rolls forever.'}],scored:true},
  {probe:'Describe one everyday example where you can now "see" an invisible force at work that you never noticed before. What is being pushed or pulled?',r:'Once you spot invisible forces everywhere, you are thinking like a scientist — that lens never switches off. Saved for your grown-up. Now, a force with a direction... 🧲'}
 ]},
 {t:'chat',label:'Dialogue II · Balanced or unbalanced',script:[
  {m:'The big rule of motion: <strong>balanced forces = no change</strong> (stays still, or keeps moving steadily); <strong>unbalanced forces = change</strong> (speeds up, slows down, or turns). Let us test if you can spot which is which.'},
  {q:'A tug-of-war where both teams pull equally hard and the rope does not move. Balanced or unbalanced?',opts:[
    {x:'Balanced — equal pulls cancel, so no movement',r:'Exactly. Two equal, opposite pulls cancel — the rope is still because forces are balanced. Now... what happens the instant one team pulls harder?',good:true},
    {x:'Unbalanced — there is lots of force!',r:'There is lots of <em>effort</em>, but the forces are equal and opposite, so they <strong>cancel</strong> — the rope stays put. That is <em>balanced</em>. Big forces can still be balanced. Movement only starts when they stop being equal.'}],scored:true},
  {q:'One team suddenly pulls harder. The rope shoots toward them. Why — in force language?',opts:[
    {x:'The forces became unbalanced, so the motion changed',r:'Perfect physics. The moment one pull beats the other, forces are unbalanced — and unbalanced forces <em>always</em> cause a change in motion. This one rule explains rockets launching, cars braking, and a rope flying sideways.',good:true},
    {x:'They got stronger arms',r:'In force language, it is not about strong arms — it is that the two pulls are no longer equal. The forces became <strong>unbalanced</strong>, and unbalanced forces always change motion. That single rule runs the whole physical world.'}],scored:true},
  {probe:'A rocket sits on a launchpad, then blasts upward. Explain the launch using the words "balanced", "unbalanced" and "force".',r:'Explaining a rocket launch with the balanced/unbalanced idea — that is genuine Year 8 thinking, arriving early. Superb. Saved for your grown-up. 🚀'}
 ]},
 {t:'reflect',q:'For most of history, even clever people believed "things naturally stop". It took careful thinking to see the hidden force. What other "obvious" everyday belief do you think might turn out to be wrong if we looked closely enough?'}
]},
{id:'pa11',em:'💨',title:'The Secret Life of Particles',blurb:'Year 7 Science: why ice, water and steam are the same stuff — and the tiny dancers that explain it',scenes:[
 {t:'podcast',ep:'Episode 8 · Bridge to Year 7',title:'The Same Water Three Ways',art:'💨',lines:[
  {v:'nova',s:'Zed, ice, water and steam. How many different substances is that?'},
  {v:'zed',s:'Three? They look completely different.'},
  {v:'nova',s:'One. It is the exact same stuff — water — wearing three different behaviours. And the reason is invisibly small.'},
  {v:'zed',s:'How can the same thing be a hard solid AND a cloud of steam?'},
  {v:'nova',s:'Because everything is made of tiny particles, far too small to see, and they are always moving. In ice, they are locked tight in rows, barely jiggling. In water, they have enough energy to slide past each other. In steam, they have gone wild — zooming apart, flying free.'},
  {v:'zed',s:'So heating something is really just... giving the tiny particles more energy to move?'},
  {v:'nova',s:'That is the whole secret. Heat is movement. Cool them down, they slow and lock together. Heat them up, they break free. Solid, liquid, gas — it is all about how much the particles are dancing.'},
  {v:'zed',s:'The same dancers, just dancing harder or softer.'},
  {v:'nova',s:'Now you understand something most adults have never quite pictured. Today, we meet the dancers.'}
 ]},
 {t:'chat',label:'Dialogue I · The three dances',script:[
  {m:'Everything around you is made of particles too small to see, and they are always moving. 🦉 The difference between solid, liquid and gas is simply how those particles are arranged and how freely they move. Let us reason it out.'},
  {q:'In a SOLID like ice, it holds its shape and cannot be squashed. What must the particles be doing?',opts:[
    {x:'Packed tightly in fixed positions, only vibrating on the spot',r:'Exactly — locked in a neat pattern, jiggling but not moving around. That is why a solid keeps its shape: the particles cannot travel. Now, what changes when ice melts into water?',good:true},
    {x:'Flying around freely with lots of space',r:'That would be a gas! In a <strong>solid</strong>, the particles are packed tight in fixed positions, only vibrating on the spot — which is exactly why a solid holds its shape and can\'t be squashed. Freedom comes later, with heat.'}],scored:true},
  {q:'A liquid like water flows and takes the shape of its container, but you still cannot squash it much. What are the particles doing now?',opts:[
    {x:'Still close together, but now able to slide past each other',r:'Perfect. Melting gave them enough energy to slip past one another — so water flows and pours — but they are still touching, so it barely squashes. A small energy boost changed everything about how it behaves.',good:true},
    {x:'Spread far apart with big gaps',r:'Not yet — big gaps mean a gas. In a <strong>liquid</strong>, particles are still close and touching (so it barely squashes), but they now have enough energy to <em>slide past</em> each other — which is why liquids flow and take their container\'s shape.'}],scored:true},
  {q:'Boil the water into steam (a gas). It now spreads to fill any space and CAN be squashed. What happened to the particles?',opts:[
    {x:'They gained lots of energy and flew apart, with big empty gaps between them',r:'You have completed the picture! Heat gave them so much energy they broke free and spread out, leaving big gaps — which is why a gas fills any container and can be compressed. Same particles throughout; only their energy and spacing changed.',good:true},
    {x:'They turned into different particles',r:'A crucial point: they are the <em>same</em> water particles the whole time! Heating just gave them enough energy to fly apart, leaving big gaps (so gas can be squashed and spreads everywhere). Nothing new was created — the dancers just danced wilder.'}],scored:true},
  {probe:'In your own words, explain what "heating something up" is really doing to its particles. Why does that make ice melt?',r:'Explaining heat as particle-movement is the core idea of Year 7 chemistry, and you just owned it. Saved for your grown-up. One more mystery... 🌡️'}
 ]},
 {t:'chat',label:'Dialogue II · The disappearing puddle',script:[
  {m:'A puzzle. 🦉 A puddle sits on the ground on a warm day. Hours later, with no one touching it and no drain, it has vanished. Where did the water go?'},
  {q:'Using particle thinking — what happened?',opts:[
    {x:'Sun\'s heat gave surface particles enough energy to escape into the air as gas',r:'Exactly — evaporation. Even without boiling, the fastest surface particles gain enough energy to break free and drift off as invisible water vapour. The puddle did not vanish; it became a gas you cannot see. Particle thinking solved the "impossible" disappearance.',good:true},
    {x:'It soaked into the air by magic',r:'No magic needed — particles explain it! The Sun\'s heat gives the fastest surface particles enough energy to <em>escape</em> into the air as invisible water vapour (a gas). That is evaporation. The water is still here, just spread out and unseen.'}],scored:true},
  {q:'That same water vapour later cools high in the sky and turns back into tiny drops. What have we just described?',opts:[
    {x:'How clouds and rain form — the water cycle',r:'You have just explained the entire water cycle using particles! Evaporate (gain energy, rise as gas), cool (lose energy, become liquid drops = clouds), fall as rain. The tiny dancers explain the weather itself. That is the power of one good idea.',good:true},
    {x:'Brand new water being made in the sky',r:'It is the <em>same</em> water, recycled! Vapour rises, cools, and its particles slow enough to clump back into liquid drops — that is how <strong>clouds</strong> form, then rain. Evaporation and condensation together make the water cycle. No new water needed.'}],scored:true},
  {probe:'You now know the water cycle is just particles gaining and losing energy. Describe the journey of one water particle from a puddle, into a cloud, and back to the ground.',r:'Following one particle through the whole cycle — that is exactly how the best scientists picture big systems: through the tiny piece. Wonderful. Saved for your grown-up. 💧'}
 ]},
 {t:'reflect',q:'The same water can be hard ice, flowing liquid or invisible steam — nothing is added or removed, only energy. Does it change anything for you to know that "solid" things are really just particles holding still? What else might be less fixed than it looks?'}
]},
{id:'rd11',em:'🔍',title:'Reading Between the Lines',blurb:'Year 7 English: the art of finding what a writer means but never quite says',scenes:[
 {t:'podcast',ep:'Episode 9 · Bridge to Year 7',title:'The Words Behind the Words',art:'🔍',lines:[
  {v:'nova',s:'Zed, if I tell you "the old man\'s hands trembled as he opened the letter", what do I know about him — that I never actually said?'},
  {v:'zed',s:'That he is... nervous? Or maybe scared of what the letter says. But you did not say either of those.'},
  {v:'zed',s:'How did I know that?'},
  {v:'nova',s:'You just did the single most important thing in English. You read between the lines. The trembling hands were a clue, and you became a detective, working out the feeling the writer left unspoken.'},
  {v:'zed',s:'So writers hide clues on purpose?'},
  {v:'nova',s:'The best ones do. They almost never write "he was nervous". They show you the trembling hands and trust you to feel it. It is called inference — reading the meaning underneath the words.'},
  {v:'zed',s:'That is basically a superpower. Seeing what is not written down.'},
  {v:'nova',s:'It is THE superpower of English, and in Year 7 it is worth more marks than anything else. Today, you learn to read the words behind the words.'},
  {v:'zed',s:'Detective mode, book edition. Let us go.'}
 ]},
 {t:'chat',label:'Dialogue I · The art of inference',script:[
  {m:'Inference means working out what a writer implies but never states directly. 🦉 Here is a line: <em>"She forced a smile and said she was fine, then turned quickly to the window."</em> What do you sense is really going on?'},
  {q:'What is she actually feeling — and how do you know?',opts:[
    {x:'She is upset — "forced" a smile and "turned away" hint she is hiding it',r:'Beautiful detective work. The writer never wrote "she was upset" — but "forced" (a real smile is not forced) and turning away give it away. You inferred the hidden feeling from the evidence in the words. That is exactly the skill examiners chase.',good:true},
    {x:'She is happy — she smiled and said she was fine',r:'Look closer at the clues: you don\'t <em>force</em> a real smile, and "fine" plus turning quickly away is what people do when hiding something. The writer is <em>showing</em> you she is upset without saying it. Reading those clues is inference.'}],scored:true},
  {q:'Why do you think good writers SHOW ("her hands trembled") instead of TELL ("she was afraid")?',opts:[
    {x:'Showing lets the reader feel it themselves — it is more powerful and real',r:'Exactly the heart of great writing. "She was afraid" is flat information; trembling hands make <em>you</em> feel the fear. Writers trust readers to infer, and that shared detective work is what makes a story come alive. Remember this when you write, too.',good:true},
    {x:'To use up more words',r:'The opposite of padding — it is more powerful! "She was afraid" just <em>tells</em> you; "her hands trembled" makes you <em>feel</em> it and work it out yourself. That reader-detective moment is what makes writing vivid. "Show, don\'t tell" is a writer\'s golden rule.'}],scored:true},
  {probe:'Write one sentence that SHOWS a character is excited — without ever using the word "excited" or "happy". Make me infer it.',r:'Writing a "show, don\'t tell" sentence means you can now use inference as a <em>writer</em>, not just a reader — that is a big leap. Saved for your grown-up. Now, whose story are we hearing? 📖'}
 ]},
 {t:'chat',label:'Dialogue II · Whose voice, whose view',script:[
  {m:'Here is a subtler skill. 🦉 The same event can be told by different narrators who make you feel completely different things. A writer <em>chooses</em> whose eyes you see through.'},
  {q:'A story about a wolf is told entirely from the WOLF\'S point of view. How might that change how you feel about it, compared to the shepherd\'s version?',opts:[
    {x:'You\'d sympathise with the wolf — hunger, fear, survival — instead of seeing a villain',r:'Exactly — and that is a huge realisation. Point of view is a lever the writer pulls to steer your sympathy. The "villain" of one telling is the hero of another. Noticing whose eyes you are borrowing is a powerful, grown-up reading skill.',good:true},
    {x:'It wouldn\'t change anything — a wolf is a wolf',r:'Try it and feel the shift: from the wolf\'s view you\'d sense its hunger, its fear, its own hungry cubs — suddenly it is not a villain but a survivor. <strong>Point of view</strong> steers your sympathy. The writer chose whose eyes you look through, and that changes everything.'}],scored:true},
  {q:'A writer describes a rainy day as "the sky wept". What is this technique doing, beyond describing weather?',opts:[
    {x:'Giving the sky a human feeling to set a sad mood — the weather mirrors emotion',r:'Lovely spotting — that is personification, and writers use it to make the setting carry emotion. "The sky wept" quietly tells you the mood is grief before any character speaks. Great readers notice how <em>every</em> choice, even the weather, is doing a job.',good:true},
    {x:'Just saying it rained in a fancy way',r:'It is fancier, yes — but it is <em>doing</em> something. Giving the sky human tears (personification) sets a <strong>sad mood</strong>: the weather mirrors the emotion of the scene. Skilled writers make even the weather carry feeling. Notice the job each choice does.'}],scored:true},
  {probe:'Take a everyday event (missing the bus, a football match) and describe it in one sentence that makes the reader feel a strong mood — using a weather or setting detail to help.',r:'Using setting to carry mood is a technique that will lift every story and essay you write. That is real craft. Saved for your grown-up. 🌧️'}
 ]},
 {t:'reflect',q:'You learned that every story is told from someone\'s point of view, which shapes how you feel. Think of an argument or event in your own life — how might the "other side" tell the same story? Does imagining their version change anything?'}
]}
],
k6:[
{id:'p3',em:'🎈',title:'Phonics Party',blurb:'Hear it, build it, read it — you brilliant word-builder!',scenes:[
 {t:'podcast',ep:'Story Time',title:'The Day Sounds Learned to Hug',art:'🎈',lines:[
  {v:'nova',s:'Are you sitting comfily? Good! Because I have a secret about words. Come closer... words are made of tiny sounds!'},
  {v:'zed',s:'Tiny sounds? Like what?'},
  {v:'nova',s:'Listen. Cat. Cuh... aa... tuh. Three little sounds, holding hands to make a word! Cuh-aa-tuh. Cat!'},

  {v:'nova',s:'You have magic ears! And here is the best part. If YOU know the sounds, YOU can build any word you like, like building with blocks.'},
  {v:'zed',s:'I love building!'},
  {v:'nova',s:'Then today, you are the builder. I will say a word, and you will build it, sound by sound. Are you ready, brilliant builder?'},

 ]},
 {t:'buildrun',label:'Build the words!',words:['cat','sun','ship','moon'],

{id:'n3',em:'🌻',title:'Number Garden',blurb:'Count, add, and grow a garden of number-flowers!',scenes:[
 {t:'podcast',ep:'Story Time',title:'The Garden That Grows With Counting',art:'🌻',lines:[

  {v:'zed',s:'Water? Sunshine?'},
  {v:'nova',s:'Even better. COUNTING makes them grow! Every time you count something correctly, up pops a brand new flower!'},

 ]},
 {t:'dotsrun',label:'Grow your garden!',sums:[[3,2],[4,4],[5,3],[6,2]],
  intro:'Count the pink dots, then the purple dots, then ALL of them together. Type your number to grow a flower! 🌸'},
 {t:'reflect',q:'Go on a number hunt! Find something you can count in your room — toys? books? teddies? How many did you find? Type the number! 🔢'}
]},
{id:'a3',em:'🦁',title:'Wonder Safari',blurb:'Amazing animal secrets that will make you shout WOW!',scenes:[
 {t:'podcast',ep:'Story Time',title:'The Octopus With Three Hearts',art:'🐙',lines:[
  {v:'nova',s:'Psst. Want to hear the most amazing animal secret in the whole ocean?'},
  {v:'zed',s:'Yes please! Tell me tell me!'},
  {v:'nova',s:'An octopus... has THREE hearts. Not one like you. Three! And its blood is not red. It is BLUE!'},
  {v:'zed',s:'THREE hearts and BLUE blood? That is bananas!'},
  {v:'nova',s:'And if an octopus loses an arm, do you know what it does? It simply grows a brand new one!'},

function confetti(){ const ems=['🎉','⭐','✨','🎈','💫','🏆','🌟'];
  for(let i=0;i<30;i++){ const s=document.createElement('div');s.className='confetti';s.textContent=pick(ems);
    s.style.left=Math.random()*100+'vw';s.style.animationDuration=(2+Math.random()*2.4)+'s';

function markDay(kid,pct,addMins){ const d=S.kids[kid].days[today()]||{best:0,mins:0,earned:false,paid:false};

  if(hourDone&&mastered)d.earned=true;

    }).join('');

      <summary><span class="term-em">${TERMS[tm].em}</span> ${TERMS[tm].name}${tm===cterm?' <span class="now-pill">now</span>':''}</summary>
      ${subjBlocks}</details>`;
  }).join('');

  const totalReady=curr.filter(u=>ready.has(u.id)).length;
  const totalMastered=curr.filter(u=>ready.has(u.id)&&D.best[u.id]!==undefined).length;

  app.innerHTML=`<div class="topbar">
    <button class="back" id="bk">← Planets</button>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="chip">⭐ <span class="grotesk" id="pts">${D.points}</span></span>
      <span class="chip">${day.earned?`💰 ${S.settings.reward} ${S.settings.currency} today ✓`:`🎯 ${S.settings.reward} ${S.settings.currency} awaits`}</span>
    </div></div>
   <div class="eyebrow">${K.tag} · ${TERMS[cterm].name}</div>
   <div class="hero-name grad-text">${esc(D.name)}'s Learning Path</div>

   <div class="today glass">
     <div class="today-ring" style="--p:${pctDay}"><b>${minsToday}<span>/${goal}m</span></b></div>
     <div class="today-body">
       <div class="eyebrow" style="color:#D9D4FF">✦ Today's hour of learning</div>
       ${minsToday>=goal

         : `<div class="today-h">${next?esc(next.t):'Your next journey'}</div><p class="dim" style="margin:4px 0 0">${remaining} more minutes to reach today's hour${next?` · about ${Math.ceil(remaining/K.mins)} journey${Math.ceil(remaining/K.mins)===1?'':'s'}`:''}.</p>`}
       ${next?`<button class="btn" id="cont" style="margin-top:14px">${minsToday>=goal?'✦ Keep exploring':'▶︎ Continue: '+esc(next.t)}</button>`:''}

/* ---------- IN-LESSON AVATAR TEACHER (Anam, scripted) ---------- */
let lessonAvatar=null;
function avatarActive(){ return !!(lessonAvatar && lessonAvatar.client && lessonAvatar.ready); }
function cleanForSpeech(t){
  let s=String(t).replace(/<[^>]+>/g,' ');
  try{ s=s.replace(/[\p{Extended_Pictographic}]/gu,''); }catch(e){}
  return s.replace(/[✦✓➕➖·—]/g,' ').replace(/\s+/g,' ').trim();
}
function avatarSay(text){
  if(!avatarActive())return false;
  const clean=cleanForSpeech(text);
  if(!clean)return true;
  try{ const c=lessonAvatar.client;
    if(typeof c.talk==='function') c.talk(clean);
    else if(typeof c.createTalkMessageStream==='function'){ const ts=c.createTalkMessageStream(); ts.streamMessageChunk(clean,true); ts.endMessage&&ts.endMessage(); }
  }catch(e){}
  return true;
}
/* speak inside a lesson: avatar if connected, otherwise the browser voice */
function lessonSpeak(text,opts){ if(avatarSay(text))return null; return speak(text,opts); }
/* The teacher is Anam's inline Widget (agent-id = persona/avatar id). No API key; auth is by hosted domain. */
function agentId(){ return (S.anam && ((S.anam.personaId||'').trim() || (S.anam.avatarId||'').trim())) || ''; }
let widgetScriptAdded=false;
function ensureWidgetScript(){
  try{
    if(widgetScriptAdded || (document.querySelector && document.querySelector('script[data-anam-widget]'))){ widgetScriptAdded=true; return; }
    if(!document.head) return;
    const s=document.createElement('script'); s.src='https://unpkg.com/@anam-ai/agent-widget'; s.async=true; s.setAttribute('data-anam-widget','1');
    document.head.appendChild(s); widgetScriptAdded=true;
  }catch(e){}
}
function teacherEmbedHTML(){ return `<anam-agent agent-id="${esc(agentId())}"></anam-agent>`; }
/* The embedded avatar only runs on a real hosted site (https, top-level window). Previews/file:// can't stream it. */
function hostedForAvatar(){
  try{
    if(location.protocol!=='http:'&&location.protocol!=='https:')return false;
    if(!location.hostname)return false;
    if(window.self!==window.top)return false;   // app previews / embeds are sandboxed
    return true;
  }catch(e){ return false; }
}
function startLessonAvatar(kid,L){
  stopLessonAvatar();
  const aid=agentId();
  if(!aid) return;   // no teacher configured → lesson narrates with the built-in voice
  const dock=document.createElement('div'); dock.id='avatarDock'; dock.className='teacher-dock';
  if(!hostedForAvatar()){
    dock.innerHTML=`<div class="td-inner"><div class="td-lock">🎬 Your teacher appears here on the live website. <span>The avatar can't stream inside a file or a preview window — open the hosted https link and it comes alive right here.</span></div></div>`;
  } else {
    ensureWidgetScript();
    dock.innerHTML=`<div class="td-inner">
      <div class="td-label"><span class="td-live">●</span> ${esc(S.anam.name||'Your teacher')}${L?` · <em>${esc(L.title)}</em>`:''}</div>
      <div class="td-stage">${teacherEmbedHTML()}</div></div>`;
  }
  document.body.insertBefore(dock,app);
  document.body.classList.add('has-avatar-dock');
}
function stopLessonAvatar(){
  const d=document.getElementById('avatarDock'); if(d)d.remove();
  document.body.classList.remove('has-avatar-dock');
  lessonAvatar=null;
}

/* ---------- PODCAST scene ---------- */
function playPodcast(sc){
  const {kid,L}=J;
  const names={nova:'Nova',zed:'Zed'};
  const lines=sc.lines.map((ln,i)=>`<div class="tline ${ln.v}" data-i="${i}"><span class="who">${names[ln.v]}</span><span>${esc(ln.s)}</span></div>`).join('');
  const bars=Array.from({length:28},()=>'<i></i>').join('');
  app.innerHTML=sceneChrome(sc.label||'Listen')+`<div class="stage">
    <div class="podcast">
     <div class="pod-head"><div class="pod-art">${sc.art||'🎧'}</div>
       <div><div class="ep">${esc(sc.ep||'The Wonder Frequency')}</div><h2>${esc(sc.title)}</h2>
       <div class="wave" id="wave">${bars}</div></div></div>
     <div class="transcript" id="ts">${lines}</div>
     <div class="pod-controls">
       <button class="btn" id="play">▶︎ Play episode</button>
       <button class="btn ghost" id="skip">Skip to dialogue →</button></div>
    </div>
    <p class="hint" style="text-align:center">Two hosts, one big idea. Listen along — the words light up as they speak. 🎧</p>
   </div>`;
  document.getElementById('quit').onclick=()=>screenDash(kid);
  const wave=document.getElementById('wave'),ts=document.getElementById('ts');
  const bars2=[...wave.children];
  let idx=0,playing=false,timer=null;
  function anim(){ bars2.forEach(b=>b.style.height=(7+Math.random()*22)+'px'); }
  function highlight(i){ ts.querySelectorAll('.tline').forEach((el,j)=>{el.classList.toggle('now',j===i);el.classList.toggle('done',j<i);});
    const cur=ts.querySelector(`[data-i="${i}"]`); if(cur)cur.scrollIntoView({block:'center',behavior:'smooth'}); }
  function stop(){ playing=false;wave.classList.remove('on');clearInterval(timer);stopSpeak();
    try{ if(avatarActive()&&lessonAvatar.client.interruptPersona)lessonAvatar.client.interruptPersona(); }catch(e){}
    const p=document.getElementById('play'); if(p)p.textContent='▶︎ Resume'; }
  function playFrom(i){
    if(i>=sc.lines.length){ stop();document.getElementById('play').textContent='↻ Play again';idx=0;
      ts.querySelectorAll('.tline').forEach(el=>el.classList.remove('now'));ts.querySelectorAll('.tline').forEach(el=>el.classList.add('done'));return; }
    idx=i;highlight(i);const ln=sc.lines[i];
    const u=lessonSpeak(ln.s,{who:ln.v,rate:ln.v==='zed'?1:.92,pitch:ln.v==='zed'?1.15:.95});
    if(u){ u.onend=()=>{ if(playing)playFrom(i+1); }; }
    else { // avatar is speaking (or no TTS): advance on a paced estimate
      const words=ln.s.split(' ').length; const per=avatarActive()?400:260, base=avatarActive()?2400:1600;
      setTimeout(()=>{if(playing)playFrom(i+1);},Math.max(base,words*per)); }
  }
  document.getElementById('play').onclick=function(){
    if(playing){stop();return;}
    playing=true;wave.classList.add('on');this.textContent='❚❚ Pause';timer=setInterval(anim,110);playFrom(idx);
  };
  document.getElementById('skip').onclick=()=>{stop();nextScene();};
}

/* ---------- CHAT scene (Socratic) ---------- */
function playChat(sc){
  const {kid,L}=J;
  app.innerHTML=sceneChrome(sc.label||'Dialogue')+`<div class="stage"><div class="chat" id="chat"></div><div id="dock"></div></div>`;
  document.getElementById('quit').onclick=()=>screenDash(kid);
  const chat=document.getElementById('chat'),dock=document.getElementById('dock');
  let step=0;
  function mentorBubble(html,cb){
    const wrap=document.createElement('div');wrap.className='msg';
    wrap.innerHTML=`<div class="avatar">🦉</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>`;
    chat.appendChild(wrap);wrap.scrollIntoView({block:'end',behavior:'smooth'});
    setTimeout(()=>{ wrap.querySelector('.bubble').innerHTML=html; lessonSpeak(html);
      wrap.scrollIntoView({block:'end',behavior:'smooth'}); if(cb)cb(); }, avatarActive()?260:Math.min(1400,500+html.length*7));
  }
  function meBubble(text){ const w=document.createElement('div');w.className='msg me';
    w.innerHTML=`<div class="avatar" style="background:radial-gradient(circle at 32% 28%,#FFE29A,#E8961D)">🙂</div><div class="bubble">${esc(text)}</div>`;
    chat.appendChild(w);w.scrollIntoView({block:'end',behavior:'smooth'}); }
  function run(){
    dock.innerHTML='';
    if(step>=sc.script.length)return nextScene();
    const node=sc.script[step];
    if(node.m){ mentorBubble(node.m,()=>{step++;run();}); return; }
    if(node.q){
      mentorBubble(node.q,()=>{
        const box=document.createElement('div');box.className='choices';
        shuffle(node.opts.map((o,i)=>({o,i}))).forEach(({o})=>{
          const b=document.createElement('button');b.innerHTML=o.x;
          b.onclick=()=>{
            dock.innerHTML='';meBubble(o.x.replace(/<[^>]+>/g,''));
            if(node.scored){ J.total++; if(o.good){J.correct++;addPoints(kid,5);} }
            mentorBubble('✦ '+o.r,()=>{
              const c=document.createElement('div');c.className='replybox';
              c.innerHTML=`<button class="btn small" id="cont">Continue →</button>`;
              dock.appendChild(c);document.getElementById('cont').onclick=()=>{step++;run();};
            });
          };
          box.appendChild(b);
        });
        dock.appendChild(box);
      });
      return;
    }
    if(node.probe){
      mentorBubble(node.probe,()=>{
        const c=document.createElement('div');c.className='replybox';
        c.innerHTML=`<textarea id="pr" rows="3" placeholder="Type your thinking..."></textarea><button class="btn" id="send">Send</button>`;
        dock.appendChild(c);
        document.getElementById('send').onclick=()=>{
          const v=document.getElementById('pr').value.trim();
          if(v.length<2){document.getElementById('pr').placeholder='Just a little something first! ✍️';return;}
          meBubble(v);S.kids[kid].journal.unshift({date:today(),lesson:L.title,q:node.probe,a:v});addPoints(kid,10);save();
          dock.innerHTML='';
          mentorBubble('✦ '+node.r,()=>{ const d=document.createElement('div');d.className='replybox';
            d.innerHTML=`<button class="btn" id="cont">Continue →</button>`;dock.appendChild(d);
            document.getElementById('cont').onclick=()=>{step++;run();}; });
        };
      });
      return;
    }
    step++;run();
  }
  run();
}

  app.innerHTML=sceneChrome(sc.label||'Activity')+`<div class="stage"><div class="glass pad" id="arena">
     <p class="hint" style="text-align:center;font-size:1rem">${sc.intro||''}</p>
     <div style="text-align:center;margin-top:18px"><button class="btn" id="begin">Begin →</button></div>
   </div></div>`;
  document.getElementById('quit').onclick=()=>screenDash(kid);
  document.getElementById('begin').onclick=()=>{ i=0; render(); };

  function done(){
    // ensure scoring totals reflect this run for tested kids
    finishJourney();
  }
  function render(){
    if(i>=items.length)return done();
    const arena=document.getElementById('arena')||(function(){app.querySelector('.stage').innerHTML='<div class="glass pad" id="arena"></div>';return document.getElementById('arena');})();
    const count=`<div class="qcount">${sc.t==='quickfire'?'Challenge':sc.t==='spellrun'?'Word':sc.t==='buildrun'?'Word':'Flower'} ${i+1} of ${items.length}</div>`;

    /* ----- QUICKFIRE (typed maths) ----- */
    if(sc.t==='quickfire'){
      const it=items[i];
      arena.innerHTML=count+`<div class="act-q">${it.q}</div>
        <div class="answer-row"><input id="ans" inputmode="text" autocomplete="off" placeholder="?"><button class="btn" id="ck">Check</button></div>
        <div class="feedback" id="fb"></div>
        <div style="text-align:center;margin-top:16px"><button class="btn ghost" id="nx" style="display:none">Next →</button></div>`;
      const inp=document.getElementById('ans');inp.focus();
      const check=()=>{
        const v=inp.value.trim().toLowerCase().replace(/\s+/g,'');
        if(!v)return;
        const ok=it.a.some(a=>String(a).toLowerCase().replace(/\s+/g,'')===v);
        J.total++; if(ok)J.correct++;
        const fb=document.getElementById('fb');
        if(ok){fb.className='feedback ok';fb.innerHTML='✓ Yes! '+it.why;addPoints(kid,5);}
        else{fb.className='feedback no';fb.innerHTML='Not quite — '+it.why;}
        document.getElementById('ck').style.display='none';
        const nx=document.getElementById('nx');nx.style.display='';nx.focus();nx.onclick=()=>{i++;render();};
        inp.disabled=true;
      };
      document.getElementById('ck').onclick=check;
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
      return;
    }

    /* ----- SPELLRUN (dictation) ----- */
    if(sc.t==='spellrun'){
      const it=items[i];
      arena.innerHTML=count+`<div style="text-align:center"><button class="speak-btn" id="say">🔊 Hear the word</button>
         <p class="hint">${it.h?('Hint: '+it.h):'Listen, then spell it.'}</p></div>
        <div class="answer-row" style="margin-top:14px"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="spell it..."><button class="btn" id="ck">Check</button></div>
        <div class="feedback" id="fb"></div>
        <div style="text-align:center;margin-top:16px"><button class="btn ghost" id="nx" style="display:none">Next →</button></div>`;
      const say=()=>lessonSpeak(it.w,{who:'nova',rate:.75});
      setTimeout(say,300);
      document.getElementById('say').onclick=say;
      const inp=document.getElementById('ans');inp.focus();
      const check=()=>{
        const v=inp.value.trim().toLowerCase();if(!v)return;
        const ok=v===it.w.toLowerCase();
        J.total++; if(ok)J.correct++;
        const fb=document.getElementById('fb');
        if(ok){fb.className='feedback ok';fb.innerHTML=`✓ Perfect — <strong>${it.w}</strong>`;addPoints(kid,5);}
        else{fb.className='feedback no';fb.innerHTML=`Not yet — it's <strong>${it.w}</strong>. ${it.h||''}`;}
        document.getElementById('ck').style.display='none';
        const nx=document.getElementById('nx');nx.style.display='';nx.focus();nx.onclick=()=>{i++;render();};
        inp.disabled=true;
      };
      document.getElementById('ck').onclick=check;
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
      return;
    }

    /* ----- BUILDRUN (letter tiles, k6) ----- */
    if(sc.t==='buildrun'){
      const word=items[i],letters=word.split('');
      const decoyPool=shuffle('aeioubcdfghmnprst'.split('').filter(c=>!letters.includes(c)));
      const tiles=shuffle(letters.concat(decoyPool.slice(0,3)));
      let built=[];
      arena.innerHTML=count+`<div style="text-align:center"><button class="speak-btn" id="say">🔊 Hear the word</button></div>
        <div class="built" id="built"></div>
        <div class="tiles" id="tiles"></div>
        <div class="feedback" id="fb"></div>
        <div style="text-align:center;margin-top:14px">
          <button class="btn ghost small" id="clr">↺ Clear</button>
          <button class="btn ghost" id="nx" style="display:none">Next →</button></div>`;
      const say=()=>lessonSpeak(word,{who:'zed',rate:.7});
      setTimeout(say,300);document.getElementById('say').onclick=say;
      const tilesEl=document.getElementById('tiles'),builtEl=document.getElementById('built'),fb=document.getElementById('fb');
      function drawBuilt(){ builtEl.innerHTML=built.map(b=>`<span>${b.ch}</span>`).join('')||'<span style="background:none;box-shadow:none;color:var(--faint);font-size:.9rem;width:auto">tap letters…</span>'; }
      function check(){
        if(built.map(b=>b.ch).join('')===word){
          fb.className='feedback ok';fb.innerHTML=`✓ You built <strong>${word}</strong>! 🎉`;addPoints(kid,5);J.correct++;J.total++;
          say();
          const nx=document.getElementById('nx');nx.style.display='';nx.onclick=()=>{i++;render();};
          tilesEl.querySelectorAll('button').forEach(b=>b.disabled=true);
        }
      }
      tiles.forEach((ch,idx)=>{ const b=document.createElement('button');b.textContent=ch;
        b.onclick=()=>{ if(b.classList.contains('used'))return; b.classList.add('used');built.push({ch,el:b});drawBuilt();
          if(built.length===word.length)check(); };
        tilesEl.appendChild(b); });
      drawBuilt();
      document.getElementById('clr').onclick=()=>{built.forEach(b=>b.el.classList.remove('used'));built=[];drawBuilt();fb.className='feedback';};
      return;
    }

    /* ----- DOTSRUN (visual addition OR subtraction, k6) ----- */
    if(sc.t==='dotsrun'){
      const [a,b]=items[i];
      const sub=sc.op==='sub';
      const ans=sub?a-b:a+b;
      let visual;
      if(sub){
        // show a dots; the last b are faded ("hopped away")
        let dots='';for(let k=0;k<a;k++)dots+=`<i class="${k>=a-b?'gone':''}"></i>`;
        visual=`<div class="dots-visual"><div class="dot-group" style="grid-template-columns:repeat(${Math.min(5,a)},26px)">${dots}</div></div>`;
      } else {
        visual=`<div class="dots-visual">
          <div class="dot-group">${'<i></i>'.repeat(a)}</div>
          <div style="font-size:2rem">➕</div>
          <div class="dot-group g2">${'<i></i>'.repeat(b)}</div></div>`;
      }
      arena.innerHTML=count+`<div class="act-q">${a} ${sub?'−':'+'} ${b} = ?</div>
        ${visual}
        <div class="answer-row"><input id="ans" inputmode="numeric" placeholder="?"><button class="btn" id="ck">Check</button></div>
        <div class="feedback" id="fb"></div>
        <div style="text-align:center;margin-top:14px"><button class="btn ghost" id="nx" style="display:none">Next →</button></div>`;
      const inp=document.getElementById('ans');inp.focus();
      const check=()=>{
        const v=inp.value.trim();if(!v)return;
        const ok=parseInt(v,10)===ans;
        J.total++;if(ok)J.correct++;
        const fb=document.getElementById('fb');
        if(ok){fb.className='feedback ok';fb.innerHTML=`✓ Yes! ${a} ${sub?'−':'+'} ${b} = <strong>${ans}</strong>! ${sub?'🐰':'🌸'}`;addPoints(kid,5);}
        else{fb.className='feedback no';fb.innerHTML=sub?`Let's count what's LEFT — ${a} take away ${b} leaves <strong>${ans}</strong>.`:`Let's count together — ${a} and ${b} more makes <strong>${ans}</strong>.`;}
        document.getElementById('ck').style.display='none';
        const nx=document.getElementById('nx');nx.style.display='';nx.focus();nx.onclick=()=>{i++;render();};
        inp.disabled=true;
      };
      document.getElementById('ck').onclick=check;
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
      return;
    }
  }
}

/* ---------- FINALE ---------- */
function finishJourney(){
  stopLessonAvatar();
  const {kid,L}=J,K=KIDS[kid];
  const tested=K.tested, scored=J.total>0;
  const pct = tested&&scored ? Math.round(J.correct/J.total*100) : 100;
  addPoints(kid,40);
  const prev=S.kids[kid].best[L.id];
  if(prev===undefined||pct>prev)S.kids[kid].best[L.id]=pct;
  const mins=Math.max(1,Math.round((Date.now()-J.start)/60000));
  logIt(kid,{lesson:L.title,pct:tested?pct:null,mins,scored:J.total});
  const day=markDay(kid,pct,K.mins);           // credit the journey's designed minutes toward today's hour
  save();confetti();
  const passMark=S.settings.passMark;
  const passed=!tested||pct>=passMark;
  const goal=goalFor(kid), hourDone=day.mins>=goal, left=Math.max(0,goal-day.mins);
  let headline,sub;
  if(!tested){ headline='You did it! 🌟'; sub=`${esc(S.kids[kid].name)}, you finished the whole journey — every story, every question. Your grown-up will be so proud!`; }
  else if(passed){ headline='Mastery achieved! 🏆'; sub=`You scored ${pct}% — above the ${passMark}% mark. Brilliant, focused thinking.`; }
  else { headline='Journey complete 💫'; sub=`You scored ${pct}%. The mark for a reward is ${passMark}% — so close! Every journey refreshes with new questions. Another run?`; }
  const hourLine = hourDone
    ? `<div class="chip" style="margin-top:8px">⏱️ Today's hour complete — ${day.mins} min ✓</div>`
    : `<div class="chip" style="margin-top:8px">⏱️ ${day.mins} / ${goal} min today — about ${Math.ceil(left/K.mins)} more journey${Math.ceil(left/K.mins)===1?'':'s'} to go</div>`;
  const rewardLine = day.earned
    ? `<div class="chip" style="margin-top:8px">💰 ${S.settings.reward} ${S.settings.currency} earned today ✓</div>`
    : (hourDone&&tested&&!passed?`<p class="hint">The hour's done — reach ${passMark}% mastery to unlock today's ${S.settings.reward} ${S.settings.currency}.</p>`:`<p class="hint">Finish today's hour of learning to unlock ${S.settings.reward} ${S.settings.currency}.</p>`);
  app.innerHTML=`<div class="finale">
    <div class="eyebrow">${L.em} ${esc(L.title)}</div>
    <div class="ring" style="--p:${pct}"><b>${tested?pct+'%':'✓'}</b></div>
    <h1 class="grad-text" style="font-size:2.4rem">${headline}</h1>
    <p class="dim" style="max-width:520px;margin:12px auto 0">${sub}</p>
    ${hourLine}
    ${rewardLine}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px">
      <button class="btn" id="more">${hourDone?'✦ Back to your path':'✦ Keep going →'}</button>
      <button class="btn ghost" id="again">↻ Run this again</button>
    </div>
    <p class="hint" style="margin-top:20px">+${40} points earned this journey · ⭐ ${S.kids[kid].points} total</p>
   </div>`;
  document.getElementById('more').onclick=()=>screenDash(kid);
  document.getElementById('again').onclick=()=>startJourney(kid,L.id);
}

function coachPromptFor(kid,ctx){
