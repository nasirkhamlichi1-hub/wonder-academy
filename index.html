  const styleForAge = age<=6
    ? 'Use simple, playful words and lots of warm encouragement. Keep every reply to one or two short sentences. Be gentle and delighted by everything they say.'
    : (age<=11
      ? 'Use clear, friendly language and vivid real-world examples. Keep replies short — two or three sentences.'
      : 'Speak like an inspiring, respectful GCSE tutor — warm but intellectually serious. Keep replies concise, two to four sentences.');
  return [
    "[STYLE] Reply only in natural spoken English. No markdown, no lists, no bullet points, no emoji. Use '...' for natural pauses. Keep it brief and conversational, as if speaking aloud.",
    `[PERSONALITY] You are ${S.anam.name||'Sage'}, a warm, encouraging Socratic tutor for children, in the wonder-filled spirit of a teacher like Professor Brian Cox.`,
    `You are speaking live with ${name}, who is ${age} years old. Right now you are helping them explore: ${topic}.`,
    'Teach the way Socrates did: ask one guiding question at a time, never lecture. When they answer, praise their reasoning first, then gently guide them toward discovering the idea themselves. Spark curiosity and wonder. If they go quiet or seem stuck, offer a small, kind hint.',
    'Never discuss anything unsafe or inappropriate for a child. If they raise something upsetting, gently suggest they talk to their grown-up. Stay on learning and encouragement.',
    styleForAge,
    (ctx&&ctx.extra)?ctx.extra:'',
    `Begin now by greeting ${name} warmly by name and asking one curious, inviting question about ${topic}.`
  ].filter(Boolean).join(' ');
}

   <div class="tabs" id="tabs">
     <button data-t="k14">🌋 ${esc(S.kids.k14.name)}</button>
     <button data-t="k11">🚀 ${esc(S.kids.k11.name)}</button>
     <button data-t="k6">🦄 ${esc(S.kids.k6.name)}</button>
     <button data-t="settings">⚙️ Settings</button>
   </div>
   <div id="ptab"></div>`;
  document.getElementById('bk').onclick=screenLaunch;
  const tabs=document.getElementById('tabs');
  function paint(){
    tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.t===parentTab));
    if(parentTab==='settings')renderSettings();else renderKid(parentTab);
  }
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{parentTab=b.dataset.t;paint();});
  paint();
}
function renderKid(kid){
  const D=S.kids[kid],K=KIDS[kid],cur=S.settings.currency;
  const journeysDone=Object.keys(D.best).length,totalJ=LESSONS[kid].length;
  const bests=Object.values(D.best);
  const avg=bests.length?Math.round(bests.reduce((a,b)=>a+b,0)/bests.length):0;
  const dayKeys=Object.keys(D.days).sort().reverse();
  const earnedDays=dayKeys.filter(d=>D.days[d].earned);
  const owed=earnedDays.filter(d=>!D.days[d].paid).length*S.settings.reward;
  const paidTotal=earnedDays.filter(d=>D.days[d].paid).length*S.settings.reward;
  const goal=goalFor(kid); const tDay=D.days[today()]||{mins:0}; const minsToday=tDay.mins||0;
  const hoursHit=dayKeys.filter(d=>(D.days[d].mins||0)>=goal).length;
  const curr=CURRICULUM[kid]||[]; const readyCount=curr.filter(u=>readySet(kid).has(u.id)).length;
  const rows=dayKeys.slice(0,30).map(d=>{const x=D.days[d];const hit=(x.mins||0)>=goal;
    return `<tr><td>${d}</td><td>${x.mins||0} min ${hit?'✓':''}</td><td>${x.best}%</td>
      <td>${x.earned?`<span class="pill pass">Earned</span>`:`<span class="pill fail">—</span>`}</td>
      <td>${x.earned?`<button class="paid-btn ${x.paid?'is-paid':''}" data-pay="${d}">${x.paid?'✓ Paid':'Mark paid'}</button>`:''}</td></tr>`;
  }).join('')||`<tr><td colspan="5" class="dim">No activity yet.</td></tr>`;
  const logRows=D.log.slice(0,25).map(l=>`<tr><td>${l.date} ${l.time||''}</td><td>${esc(l.lesson||'')}</td>
     <td>${l.pct==null?'<span class="dim">finished</span>':l.pct+'%'}</td><td>${l.mins?l.mins+' min':''}</td></tr>`).join('')
     ||`<tr><td colspan="4" class="dim">No journeys completed yet.</td></tr>`;
  const journal=D.journal.slice(0,40).map(j=>`<div class="journal-entry">
     <div class="q">${esc(j.lesson||'')} · ${j.date}</div>
     <div class="q" style="color:var(--dim);font-weight:700;margin-top:4px">${j.q?j.q.replace(/<[^>]+>/g,''):''}</div>
     <div class="a">${esc(j.a)}</div></div>`).join('')||`<p class="dim">No reflections recorded yet. They appear here when ${esc(D.name)} answers the thinking questions inside journeys.</p>`;
  document.getElementById('ptab').innerHTML=`
    <div class="stat-row">
      <div class="stat"><div class="n">${minsToday}<span style="font-size:1rem">/${goal}m</span></div><div class="l">⏱️ Today's hour</div></div>
      <div class="stat"><div class="n">${hoursHit}</div><div class="l">Days hour hit</div></div>
      <div class="stat"><div class="n">${journeysDone}/${readyCount}</div><div class="l">Journeys mastered</div></div>
      <div class="stat"><div class="n">${K.tested?avg+'%':'—'}</div><div class="l">Avg mastery</div></div>
      <div class="stat"><div class="n money">${owed} ${cur}</div><div class="l">Owed (unpaid)</div></div>
      <div class="stat"><div class="n">${paidTotal} ${cur}</div><div class="l">Paid to date</div></div>
    </div>
    ${K.tested?'':`<p class="hint">🦄 ${esc(D.name)} earns the daily reward by completing the daily learning time — no pass mark for our youngest explorer.</p>`}
    <div class="glass pad" style="margin:16px 0">
      <h3 style="margin-bottom:6px">💰 Reward days</h3>
      <p class="hint" style="margin-top:0">${esc(D.name)} earns ${S.settings.reward} ${cur} on any day they complete their ${goal}-minute hour of learning${K.tested?` <em>and</em> reach ${S.settings.passMark}% mastery`:''}. Tap to mark it paid.</p>
      <div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Time</th><th>Best</th><th>Reward</th><th>Paid?</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>
    <div class="glass pad" style="margin:16px 0">
      <h3 style="margin-bottom:10px">📈 Activity log</h3>
      <div style="overflow-x:auto"><table><thead><tr><th>When</th><th>Journey</th><th>Score</th><th>Time</th></tr></thead><tbody>${logRows}</tbody></table></div>
    </div>
    <div class="glass pad">
      <h3 style="margin-bottom:10px">💭 Thinking Journal</h3>
      <p class="hint" style="margin-top:0">Every idea ${esc(D.name)} writes inside a journey — the real evidence of learning.</p>
      ${journal}
    </div>`;
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{
    const d=b.dataset.pay;S.kids[kid].days[d].paid=!S.kids[kid].days[d].paid;save();renderKid(kid);
  });
}
function renderSettings(){
  const s=S.settings;
  document.getElementById('ptab').innerHTML=`
   <div class="glass pad" style="margin-bottom:16px">
     <h3 style="margin-bottom:6px">🎯 Rewards</h3>
     <div class="setup-form">
       <label>Pass mark for the two older explorers (%)</label><input id="pm" type="number" min="0" max="100" value="${s.passMark}">
       <label>Reward per qualifying day</label><input id="rw" type="number" min="0" value="${s.reward}">
       <label>Currency label</label><input id="cur" maxlength="6" value="${esc(s.currency)}">
       <div style="margin-top:18px"><button class="btn" id="saveset">Save settings</button></div>
       <p class="hint" id="setmsg"></p>
     </div>
   </div>
   <div class="glass pad" style="margin-bottom:16px">
     <h3 style="margin-bottom:6px">⏱️ Daily learning hour</h3>
     <p class="hint" style="margin-top:0">How many minutes of learning each explorer should do a day to earn their reward. Each journey is worth its own length (about ${KIDS.k14.mins} min for the older two, ${KIDS.k6.mins} for the youngest).</p>
     <div class="setup-form">
       <label>🌋 ${esc(S.kids.k14.name)} — daily minutes</label><input id="g14" type="number" min="0" step="5" value="${goalFor('k14')}">
       <label>🚀 ${esc(S.kids.k11.name)} — daily minutes</label><input id="g11" type="number" min="0" step="5" value="${goalFor('k11')}">
       <label>🦄 ${esc(S.kids.k6.name)} — daily minutes</label><input id="g6" type="number" min="0" step="5" value="${goalFor('k6')}">
       <div style="margin-top:18px"><button class="btn" id="savegoal">Save daily hours</button></div>
       <p class="hint" id="goalmsg"></p>
     </div>
   </div>
   <div class="glass pad" style="margin-bottom:16px">
     <h3 style="margin-bottom:6px">🎥 Live Avatar Coach (Anam)</h3>
     <p class="hint" style="margin-top:0">Add your Anam API key to give the children a real, talking teacher they can speak with — on the dashboard and inside every lesson. Create a key and pick an avatar at <strong>anam.ai</strong>.</p>
     <p class="hint" style="color:#FFD9A8;background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.35);border-radius:12px;padding:10px 13px">⚠️ Your key is saved in this browser and is readable by anyone who can open this page's code. Host the site privately and don't share the public link. For full security, use a small server token endpoint instead (see the hosting guide).</p>
     <div class="setup-form">
       <label>✅ Easiest: Anam share link</label><input id="anamShare" placeholder="https://lab.anam.ai/share/…" value="${esc((S.anam&&S.anam.shareToken)||'')}">
       <p class="hint" style="margin-top:4px">In Anam Lab, open your persona → click <strong>Share</strong> → paste the link here. This embeds your published avatar directly, needs no API key, and is the most reliable option. When set, it's used everywhere.</p>
       <hr style="border:none;border-top:1px solid var(--line);margin:16px 0">
       <p class="hint" style="margin-top:0">Advanced — only needed if you're <em>not</em> using a share link:</p>
       <label>Anam API key</label><input id="anamKey" type="password" autocomplete="off" placeholder="paste your key" value="${esc((S.anam&&S.anam.apiKey)||'')}">
       <label>Coach name (optional)</label><input id="anamName" maxlength="20" placeholder="e.g. Ms Nova" value="${esc((S.anam&&S.anam.name)||'')}">
       <label>Widget agent ID (persona ID) — powers the embedded teacher</label><input id="anamPersona" placeholder="paste your Anam Widget agent-id" value="${esc((S.anam&&S.anam.personaId)||'')}">
       <p class="hint" style="margin-top:4px">Build a Persona in Anam Lab (choose your avatar, a voice and a brain), publish it, and paste its Persona ID here. This is the most reliable way to use a custom avatar.</p>
       <details style="margin-top:12px">
         <summary style="cursor:pointer;color:var(--dim);font-weight:700">Advanced — custom avatar, voice & model IDs</summary>
         <label>Avatar ID</label><input id="anamAvatar" placeholder="default: Cara" value="${esc((S.anam&&S.anam.avatarId)||'')}">
         <label>Voice ID</label><input id="anamVoice" placeholder="default voice" value="${esc((S.anam&&S.anam.voiceId)||'')}">
         <label>LLM / brain ID</label><input id="anamLlm" placeholder="default brain" value="${esc((S.anam&&S.anam.llmId)||'')}">
         <label>Avatar model (optional)</label><input id="anamModel" placeholder="cara-4" value="${esc((S.anam&&S.anam.avatarModel)||'')}">
         <p class="hint">Copy these from the Anam Lab (avatar gallery, voice list, persona settings). Leave blank to use the default Cara avatar and voice.</p>
       </details>
       <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
         <button class="btn" id="saveanam">Save coach</button>
         <button class="btn ghost" id="clearanam">Remove coach</button>
       </div>
       <p class="hint" id="anammsg"></p>
     </div>
   </div>
   <div class="glass pad" style="margin-bottom:16px">
     <h3 style="margin-bottom:6px">✏️ Explorer names</h3>
     <div class="setup-form">
       <label>🌋 Eldest</label><input id="nm14" value="${esc(S.kids.k14.name)}" maxlength="14">
       <label>🚀 Middle</label><input id="nm11" value="${esc(S.kids.k11.name)}" maxlength="14">
       <label>🦄 Youngest</label><input id="nm6" value="${esc(S.kids.k6.name)}" maxlength="14">
       <div style="margin-top:18px"><button class="btn ghost" id="savenm">Update names</button></div>
     </div>
   </div>
   <div class="glass pad" style="margin-bottom:16px">
     <h3 style="margin-bottom:6px">🔐 Parent PIN</h3>
     <div class="setup-form">
       <label>New 4-digit PIN</label><input id="np" maxlength="4" inputmode="numeric" placeholder="••••">
       <div style="margin-top:18px"><button class="btn ghost" id="savepin">Change PIN</button></div>
       <p class="hint" id="pinmsg"></p>
     </div>
   </div>
   <div class="glass pad" style="margin-bottom:16px">
     <h3 style="margin-bottom:6px">💾 Backup</h3>
     <p class="hint" style="margin-top:0">Progress is saved on <em>this device only</em>. Export a backup to move it to another device, or to keep it safe.</p>
     <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
       <button class="btn ghost" id="exp">⬇ Export backup</button>
       <label class="btn ghost" style="cursor:pointer">⬆ Import backup<input id="imp" type="file" accept="application/json" hidden></label>
     </div>
   </div>
   <div class="glass pad">
     <h3 style="margin-bottom:6px">⚠️ Reset</h3>
     <p class="hint" style="margin-top:0">Erase everything and start fresh. This cannot be undone.</p>
     <button class="btn ghost" id="reset" style="margin-top:10px;border-color:rgba(255,122,133,.5);color:var(--red)">Reset the Academy</button>
   </div>`;
  document.getElementById('saveset').onclick=()=>{
    const pm=Math.max(0,Math.min(100,parseInt(document.getElementById('pm').value)||0));
    const rw=Math.max(0,parseInt(document.getElementById('rw').value)||0);
    const cur=document.getElementById('cur').value.trim()||'dhs';
    S.settings.passMark=pm;S.settings.reward=rw;S.settings.currency=cur;save();
    document.getElementById('setmsg').textContent='✓ Saved.';
  };
  document.getElementById('savegoal').onclick=()=>{
    const gv=id=>Math.max(0,parseInt(document.getElementById(id).value)||0);
    if(!S.settings.goal)S.settings.goal={};
    S.settings.goal.k14=gv('g14');S.settings.goal.k11=gv('g11');S.settings.goal.k6=gv('g6');save();
    document.getElementById('goalmsg').textContent='✓ Daily learning hours saved.';
  };
  document.getElementById('saveanam').onclick=()=>{
    const v=id=>document.getElementById(id).value.trim();
    S.anam={apiKey:v('anamKey'),name:v('anamName'),shareToken:v('anamShare'),personaId:v('anamPersona'),avatarId:v('anamAvatar'),voiceId:v('anamVoice'),llmId:v('anamLlm'),avatarModel:v('anamModel')};
    save();
    document.getElementById('anammsg').textContent=coachAvailable()?'✓ Coach saved — a “Talk to your coach” button now appears for the children.':'Saved (add your Anam share link or API key to switch the coach on).';
  };
  document.getElementById('clearanam').onclick=()=>{
    S.anam={apiKey:'',name:'',shareToken:'',personaId:'',avatarId:'',voiceId:'',llmId:'',avatarModel:''};save();
    ['anamShare','anamKey','anamName','anamPersona','anamAvatar','anamVoice','anamLlm','anamModel'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
    document.getElementById('anammsg').textContent='Coach removed.';
  };
  document.getElementById('savenm').onclick=()=>{
    S.kids.k14.name=document.getElementById('nm14').value.trim()||S.kids.k14.name;
    S.kids.k11.name=document.getElementById('nm11').value.trim()||S.kids.k11.name;
    S.kids.k6.name=document.getElementById('nm6').value.trim()||S.kids.k6.name;save();screenParent();
  };
  document.getElementById('savepin').onclick=()=>{
    const np=document.getElementById('np').value.trim();
    if(!/^\d{4}$/.test(np)){document.getElementById('pinmsg').textContent='PIN must be 4 digits.';return;}
    S.parentPin=np;save();document.getElementById('pinmsg').textContent='✓ PIN updated.';
  };
  document.getElementById('exp').onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='wonder-academy-backup-'+today()+'.json';a.click();
  };
  document.getElementById('imp').onchange=e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(d&&d.kids){S=d;save();alert('Backup restored!');screenParent();}else alert('That file does not look like a Wonder Academy backup.');}catch(err){alert('Could not read that file.');}};
    r.readAsText(f);
  };
  document.getElementById('reset').onclick=()=>{
    if(confirm('Erase ALL progress and start fresh? This cannot be undone.')){
      S=JSON.parse(JSON.stringify(DEFAULT_STATE));save();screenSetup();
    }
  };
}

/* ---------- boot ---------- */
/* live-coach launch buttons work across every screen via delegation */
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('[data-coach]'); if(!b)return;
  openCoach(b.dataset.coach,{topic:b.dataset.topic||''}); });

if(!store.ok){
  const warn=document.createElement('div');
  warn.style.cssText='position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(255,184,77,.14);border-top:1px solid rgba(255,184,77,.4);color:#FFE0A8;padding:10px 16px;font-size:.82rem;text-align:center;backdrop-filter:blur(8px)';
  warn.innerHTML='👀 Preview mode — progress will not save here. Download the file and open it (or host it) for full saving.';
  document.body.appendChild(warn);
}
if(!S.setup)screenSetup();else screenLaunch();
</script>
</body>
</html>
