<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wonder Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400&family=Nunito:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#070A1E; --bg1:#0D1130; --bg2:#141A45;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.22);
  --txt:#EEF0FF; --dim:#9CA3D4; --faint:#6A71A8;
  --teal:#2DD4CB; --teal-deep:#0E8F8B;
  --amber:#FFB84D; --amber-deep:#E8921D;
  --coral:#FF6B93; --coral-deep:#E84A72;
  --violet:#8B7CF6; --gold:#FFD76A; --green:#3DDC97; --red:#FF7A85;
  --r:26px; --r-sm:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg0);color:var(--txt);min-height:100vh;overflow-x:hidden}
h1,h2,h3,.disp{font-family:'Fraunces',Georgia,serif}
.grotesk{font-family:'Space Grotesk',monospace}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
input,textarea{font-family:inherit;font-size:1rem}
::selection{background:var(--violet);color:#fff}
#app{position:relative;z-index:2;max-width:1020px;margin:0 auto;padding:22px 18px 90px}

/* ---------- cosmic ambience ---------- */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.aurora{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;z-index:0;pointer-events:none;animation:drift 26s ease-in-out infinite alternate}
.au1{width:60vw;height:60vw;top:-25vw;left:-15vw;background:radial-gradient(circle,#3B2E8C 0%,transparent 65%)}
.au2{width:55vw;height:55vw;bottom:-25vw;right:-15vw;background:radial-gradient(circle,#0E4A5C 0%,transparent 65%);animation-delay:-9s}
.au3{width:36vw;height:36vw;top:30vh;right:8vw;background:radial-gradient(circle,#5C2450 0%,transparent 65%);animation-delay:-17s;opacity:.38}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(4vw,-3vh) scale(1.12)}}
body[data-accent="teal"] .au3{background:radial-gradient(circle,#0E6E63 0%,transparent 65%)}
body[data-accent="amber"] .au3{background:radial-gradient(circle,#8C5A16 0%,transparent 65%)}
body[data-accent="coral"] .au3{background:radial-gradient(circle,#8C2E4A 0%,transparent 65%)}
@media (prefers-reduced-motion:reduce){.aurora{animation:none}}

/* ---------- glass & type ---------- */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08)}
.pad{padding:28px}
.eyebrow{font-family:'Space Grotesk';font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.grad-text{background:linear-gradient(105deg,#fff 20%,#C9C4FF 55%,#8FE8E2 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.dim{color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 30px;border-radius:999px;font-weight:800;font-size:1.02rem;color:#0B0E23;background:linear-gradient(120deg,#FFE9A8,var(--gold));box-shadow:0 10px 34px rgba(255,215,106,.28);transition:transform .18s,box-shadow .18s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(255,215,106,.4)}
.btn:disabled{opacity:.35;transform:none;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--glass2);color:var(--txt);border:1px solid var(--line2);box-shadow:none}
.btn.small{padding:9px 18px;font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:800;font-size:.88rem}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.back{font-weight:800;color:var(--dim);font-size:.95rem;display:inline-flex;gap:6px;align-items:center;padding:8px 4px}
.back:hover{color:var(--txt)}

/* ---------- launch ---------- */
.launch{text-align:center;padding-top:4vh;position:relative}
.launch h1{font-size:clamp(2.6rem,7vw,4.6rem);font-weight:900;line-height:1.04;margin:.25em 0 .2em}
.launch p.sub{color:var(--dim);max-width:540px;margin:0 auto 8px;font-size:1.1rem;line-height:1.6}
.orbit-wrap{position:relative;width:min(600px,94vw);height:min(600px,94vw);margin:16px auto 0}
.orbit{position:absolute;inset:0;margin:auto;border:1px solid rgba(255,255,255,.09);border-radius:50%;pointer-events:none}
.o1{width:36%;height:36%}.o2{width:66%;height:66%}.o3{width:96%;height:96%}
.sun{position:absolute;inset:0;margin:auto;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#FFF3CF,#FFD76A 55%,#E8961D);box-shadow:0 0 90px rgba(255,215,106,.55),0 0 200px rgba(255,190,80,.25);display:flex;align-items:center;justify-content:center;font-size:2.3rem;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 90px rgba(255,215,106,.5)}50%{box-shadow:0 0 130px rgba(255,215,106,.75)}}
.spinner{position:absolute;inset:0;margin:auto;animation:spin linear infinite;pointer-events:none}
.s1{width:36%;height:36%;animation-duration:30s}.s2{width:66%;height:66%;animation-duration:52s}.s3{width:96%;height:96%;animation-duration:76s}
@keyframes spin{to{transform:rotate(360deg)}}
.planet{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.planet button{pointer-events:auto;width:118px;height:118px;border-radius:50%;color:#fff;font-weight:800;font-size:.88rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .25s;animation:spin linear infinite reverse;border:1px solid rgba(255,255,255,.35)}
.s1 .planet button{animation-duration:30s}.s2 .planet button{animation-duration:52s}.s3 .planet button{animation-duration:76s}
.planet button:hover{transform:scale(1.14)}
.planet .em{font-size:2rem;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
.orbit-wrap:hover .spinner,.orbit-wrap:hover .planet button{animation-play-state:paused}
.p-teal button{background:radial-gradient(circle at 32% 28%,#7FF5EC,var(--teal-deep) 70%);box-shadow:0 0 44px rgba(45,212,203,.45)}
.p-amber button{background:radial-gradient(circle at 32% 28%,#FFD9A0,var(--amber-deep) 70%);box-shadow:0 0 44px rgba(255,184,77,.45)}
.p-coral button{background:radial-gradient(circle at 32% 28%,#FFB3C8,var(--coral-deep) 70%);box-shadow:0 0 44px rgba(255,107,147,.45)}
.parent-link{margin-top:30px}
@media (prefers-reduced-motion:reduce){.spinner,.planet button,.sun{animation:none}.s1 .planet{top:6%}.s2 .planet{top:50%;left:2%}.s3 .planet{top:94%}}

/* ---------- dashboard ---------- */
.hero-name{font-size:clamp(1.9rem,5vw,2.8rem);font-weight:900}
.wordday{position:relative;overflow:hidden;border-radius:var(--r);padding:26px 28px;margin:20px 0 26px;background:linear-gradient(120deg,rgba(139,124,246,.28),rgba(45,212,203,.16));border:1px solid var(--line2)}
.wordday .w{font-family:'Fraunces';font-size:2rem;font-weight:900}
.wordday .d{color:#D9DCFF;margin-top:6px;max-width:620px;line-height:1.55}
.journey-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.subject{margin:26px 0}
.subject-head{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.subject-head h2{font-size:1.35rem;font-weight:900}
.subject-head .subj-ic{font-size:1.5rem;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
.subject-head .subj-count{margin-left:auto;font-family:'Space Grotesk';font-size:.78rem;font-weight:700;color:var(--faint);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 13px}
.subject-head:after{content:'';flex:0 0 0}
/* Today hour panel */
.today{display:flex;gap:22px;align-items:center;padding:22px 24px;margin:20px 0 8px}
.today-ring{--p:0;width:104px;height:104px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.09) 0);position:relative}
.today-ring:before{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--bg1)}
.today-ring b{position:relative;font-family:'Space Grotesk';font-size:1.6rem;font-weight:700;line-height:1}
.today-ring b span{display:block;font-size:.7rem;color:var(--faint);font-weight:400;margin-top:2px}
.today-body{flex:1;min-width:0}
.today-h{font-family:'Fraunces';font-size:1.4rem;font-weight:700;margin-top:2px}
.uptext{margin:24px 0 12px}
.yearhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 6px;flex-wrap:wrap}
/* Year map term accordions */
.term{margin:12px 0;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--glass)}
.term>summary{list-style:none;cursor:pointer;padding:16px 20px;font-family:'Fraunces';font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:10px}
.term>summary::-webkit-details-marker{display:none}
.term>summary:after{content:'⌄';margin-left:auto;font-family:'Space Grotesk';color:var(--dim);transition:transform .2s}
.term[open]>summary:after{transform:rotate(180deg)}
.term-em{font-size:1.3rem}
.now-pill{font-family:'Space Grotesk';font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;background:var(--gold);color:#0B0E23;border-radius:999px;padding:3px 9px;font-weight:700;vertical-align:middle}
.term .subject{margin:8px 20px 18px}
.journey.soon{opacity:.62;border-style:dashed;cursor:default;background:rgba(255,255,255,.03)}
.journey.soon:hover{transform:none;box-shadow:none}
.soon-tag{color:var(--faint)!important}
/* Live avatar coach */
.coach-chip{cursor:pointer;background:linear-gradient(120deg,rgba(139,124,246,.35),rgba(45,212,203,.25));border:1px solid var(--line2);color:#fff}
.coach-chip:hover{filter:brightness(1.12)}
.coach-cta{background:linear-gradient(120deg,#8B7CF6,#2DD4CB);color:#fff;box-shadow:0 10px 30px rgba(139,124,246,.4)}
.coach-cta:hover{filter:brightness(1.08)}
/* In-lesson embedded teacher (Anam Widget) */
.teacher-dock{position:sticky;top:0;z-index:9;max-width:1020px;margin:0 auto;padding:10px 18px 12px;background:linear-gradient(var(--bg0) 66%,rgba(7,10,30,.9) 90%,transparent)}
.td-inner{background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:20px;padding:10px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.td-label{display:flex;align-items:center;gap:8px;font-family:'Fraunces';font-size:1.05rem;font-weight:800;padding:2px 6px 8px}
.td-label em{font-style:normal;color:var(--gold);font-family:system-ui;font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.td-live{color:#3DDC97;font-size:.7rem;animation:pulse 1.8s ease-in-out infinite}
.td-stage{border-radius:14px;overflow:hidden;background:#05060f;min-height:190px}
.td-stage anam-agent{display:block;width:100%;height:300px;max-height:42vh}
.td-lock{padding:16px 18px;text-align:center;color:var(--dim);font-size:.92rem;line-height:1.5}
.td-lock span{display:block;font-size:.8rem;opacity:.8;margin-top:4px}
body.has-avatar-dock #app{padding-top:6px}
.coach-widget-head{font-family:'Fraunces';font-weight:800;font-size:1.3rem;padding:14px 18px 6px}
.coach-widget-head em{font-style:normal;color:var(--gold);font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.coach-widget-stage{border-radius:16px;overflow:hidden;margin:6px 14px;background:#05060f}
.coach-widget-stage anam-agent{display:block;width:100%;height:min(64vh,520px)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(max-width:620px){.teacher-dock{padding:6px 10px 8px}.td-stage anam-agent{height:230px;max-height:36vh}}
.coach-overlay{position:fixed;inset:0;z-index:100;background:rgba(4,6,20,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:16px;animation:msgin .3s ease both}
.coach-card{width:min(1000px,97vw);max-height:95vh;overflow:hidden;display:flex;position:relative;padding:0}
.coach-close{position:absolute;top:12px;right:12px;z-index:3;background:rgba(0,0,0,.45);border:1px solid var(--line2);border-radius:999px;padding:8px 15px;font-weight:800;color:#fff}
.coach-close:hover{background:rgba(0,0,0,.7)}
.coach-stage{flex:1.5;min-width:0;position:relative;background:#05060f;display:flex;align-items:center;justify-content:center;min-height:360px}
.coach-stage video{width:100%;height:100%;max-height:95vh;object-fit:cover;display:block}
.coach-status{position:absolute;color:var(--dim);font-weight:700;text-align:center;padding:24px;line-height:1.5}
.coach-side{flex:1;min-width:238px;max-width:330px;padding:22px;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.coach-name{font-family:'Fraunces';font-size:1.5rem;font-weight:800}
.coach-topic{color:var(--gold);font-size:.82rem;font-weight:700;margin:2px 0 14px;text-transform:uppercase;letter-spacing:.04em}
.coach-transcript{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;margin-bottom:14px;min-height:120px}
.tmsg{font-size:.92rem;line-height:1.45;padding:9px 13px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.tmsg.you{background:rgba(139,124,246,.2);align-self:flex-end;border-color:rgba(139,124,246,.4)}
.tmsg b{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:3px}
.coach-controls{display:flex;gap:8px}
.coach-empty{padding:48px 30px;text-align:center;width:100%}
.coach-empty .em{font-size:3.2rem}
.coach-frame-note{padding:9px 14px;font-size:.8rem;color:var(--dim);text-align:center;background:rgba(0,0,0,.25)}
.coach-frame-note a{color:var(--gold);font-weight:700}
@media(max-width:680px){.coach-card{flex-direction:column;max-height:96vh;overflow-y:auto}.coach-side{max-width:none;border-left:none;border-top:1px solid var(--line)}.coach-stage{min-height:44vh}}
.journey{position:relative;overflow:hidden;border-radius:var(--r);padding:26px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;width:100%;border:1px solid var(--line2);background:var(--glass);backdrop-filter:blur(12px);transition:transform .22s,box-shadow .22s}
.journey:hover{transform:translateY(-5px);box-shadow:0 26px 60px rgba(0,0,0,.45)}
.journey .halo{position:absolute;width:220px;height:220px;border-radius:50%;filter:blur(50px);opacity:.55;top:-70px;right:-60px}
.journey .em{font-size:2.4rem;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4))}
.journey h3{font-size:1.45rem;margin:10px 0 6px;position:relative}
.journey .blurb{color:var(--dim);font-size:.95rem;line-height:1.5;position:relative}
.journey .meta{margin-top:14px;font-family:'Space Grotesk';font-size:.76rem;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;position:relative}
.journey .mastery{position:absolute;top:18px;right:18px;font-family:'Space Grotesk';font-weight:700;font-size:.8rem;background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:999px;padding:5px 12px}

/* ---------- constellation progress ---------- */
.constellation{display:flex;align-items:center;gap:0;margin:6px 0 26px;flex-wrap:wrap}
.const-star{width:15px;height:15px;border-radius:50%;background:var(--glass2);border:1px solid var(--line2);position:relative;flex:none}
.const-star.lit{background:var(--gold);box-shadow:0 0 14px var(--gold);border-color:var(--gold)}
.const-star.now{background:#fff;box-shadow:0 0 18px #fff;border-color:#fff;transform:scale(1.25)}
.const-line{height:1px;flex:1;min-width:12px;background:var(--line)}
.const-line.lit{background:linear-gradient(90deg,var(--gold),rgba(255,215,106,.3))}

/* ---------- chapter opener ---------- */
.chapter{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:rise .8s ease both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.chapter .orb{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:4rem;margin-bottom:26px;animation:pulse 4s ease-in-out infinite}
.chapter h1{font-size:clamp(2.1rem,6vw,3.6rem);font-weight:900;max-width:16ch;line-height:1.08}
.chapter p{color:var(--dim);max-width:520px;margin:16px auto 30px;font-size:1.12rem;line-height:1.65}

/* ---------- mentor chat ---------- */
.stage{max-width:760px;margin:0 auto}
.scene-title{display:flex;align-items:center;gap:10px;margin-bottom:18px;color:var(--dim);font-family:'Space Grotesk';font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}
.scene-title:before,.scene-title:after{content:'';height:1px;background:var(--line);flex:1}
.chat{display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:13px;align-items:flex-end;animation:msgin .45s ease both}
@keyframes msgin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:radial-gradient(circle at 32% 28%,#B9AEFF,#5A48C7);box-shadow:0 0 22px rgba(139,124,246,.5);border:1px solid rgba(255,255,255,.35)}
.bubble{max-width:78%;padding:16px 20px;border-radius:22px 22px 22px 6px;background:var(--glass2);border:1px solid var(--line);line-height:1.6;font-size:1.04rem}
.bubble strong{color:var(--gold)}
.bubble em{color:#C9C4FF}
.msg.me{flex-direction:row-reverse}
.msg.me .bubble{border-radius:22px 22px 6px 22px;background:linear-gradient(120deg,rgba(139,124,246,.4),rgba(139,124,246,.22));border-color:rgba(139,124,246,.5)}
.typing{display:inline-flex;gap:5px;padding:16px 20px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.choices{display:flex;flex-direction:column;gap:10px;margin:6px 0 0 59px;animation:msgin .4s ease both}
.choices button{text-align:left;padding:14px 18px;border-radius:16px;background:rgba(139,124,246,.12);border:1px solid rgba(139,124,246,.4);font-weight:700;font-size:.99rem;transition:all .16s;color:var(--txt)}
.choices button:hover{background:rgba(139,124,246,.28);transform:translateX(4px)}
.replybox{display:flex;gap:10px;margin:6px 0 0 59px;animation:msgin .4s ease both}
.replybox input,.replybox textarea{flex:1;padding:14px 18px;border-radius:16px;background:rgba(0,0,0,.3);border:1px solid var(--line2);color:var(--txt);font-size:1rem}
.replybox input:focus,.replybox textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,124,246,.25)}
.replybox .btn{padding:12px 22px}
.chat-tools{margin:4px 0 0 59px;display:flex;gap:8px;flex-wrap:wrap}
.tool-btn{font-size:.82rem;font-weight:700;color:var(--dim);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.tool-btn:hover{color:var(--txt);border-color:var(--line2)}

/* ---------- podcast ---------- */
.podcast{border-radius:var(--r);overflow:hidden;border:1px solid var(--line2);background:linear-gradient(160deg,rgba(139,124,246,.16),rgba(14,74,92,.2))}
.pod-head{padding:26px 28px 20px;display:flex;gap:18px;align-items:center;border-bottom:1px solid var(--line)}
.pod-art{width:88px;height:88px;border-radius:20px;background:radial-gradient(circle at 30% 25%,#B9AEFF,#3B2E8C);display:flex;align-items:center;justify-content:center;font-size:2.6rem;flex:none;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.pod-head h2{font-size:1.5rem}
.pod-head .ep{font-family:'Space Grotesk';font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.wave{display:flex;gap:4px;align-items:center;height:34px;margin-top:10px}
.wave i{width:4px;border-radius:3px;background:var(--violet);height:8px;transition:height .12s}
.wave.on i{animation:wv .8s ease-in-out infinite}
.wave.on i:nth-child(odd){animation-duration:.6s}
@keyframes wv{0%,100%{height:7px}50%{height:26px}}
.transcript{padding:20px 28px 26px;max-height:320px;overflow-y:auto}
.tline{display:flex;gap:12px;padding:10px 12px;border-radius:14px;margin-bottom:6px;opacity:.4;transition:all .3s;line-height:1.55}
.tline .who{font-family:'Space Grotesk';font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;flex:none;width:64px;padding-top:3px}
.tline.nova .who{color:var(--gold)}.tline.zed .who{color:var(--teal)}
.tline.now{opacity:1;background:rgba(255,255,255,.07)}
.tline.done{opacity:.75}
.pod-controls{display:flex;gap:10px;padding:0 28px 26px;flex-wrap:wrap}

/* ---------- activities ---------- */
.act-q{font-family:'Fraunces';font-size:1.7rem;font-weight:600;text-align:center;margin:8px 0 18px}
.answer-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.answer-row input{min-width:180px;padding:15px 20px;border-radius:16px;background:rgba(0,0,0,.3);border:1px solid var(--line2);color:var(--txt);font-size:1.25rem;text-align:center;font-family:'Space Grotesk'}
.answer-row input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,215,106,.2)}
.feedback{margin:16px auto 0;padding:15px 20px;border-radius:16px;font-weight:700;display:none;max-width:560px;text-align:center;line-height:1.5}
.feedback.ok{display:block;background:rgba(61,220,151,.14);border:1px solid rgba(61,220,151,.45);color:#B8F5DC}
.feedback.no{display:block;background:rgba(255,122,133,.12);border:1px solid rgba(255,122,133,.4);color:#FFC9CE}
.speak-btn{background:rgba(139,124,246,.18);border:1px solid rgba(139,124,246,.5);color:#D9D4FF;border-radius:999px;padding:13px 24px;font-weight:800;font-size:1rem}
.speak-btn:hover{background:rgba(139,124,246,.32)}
.tiles{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;justify-content:center}
.tiles button{width:60px;height:60px;border-radius:16px;background:var(--glass2);border:1px solid var(--line2);font-size:1.6rem;font-weight:800;transition:all .15s}
.tiles button:hover{border-color:var(--gold);transform:translateY(-3px)}
.tiles button.used{opacity:.15;pointer-events:none}
.built{min-height:64px;display:flex;gap:10px;margin:16px auto 0;padding:10px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:18px;flex-wrap:wrap;align-items:center;justify-content:center;max-width:420px}
.built span{width:50px;height:50px;border-radius:13px;background:linear-gradient(140deg,var(--coral),var(--coral-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;box-shadow:0 6px 16px rgba(232,74,114,.4)}
.dots-visual{display:flex;gap:26px;margin:18px 0;flex-wrap:wrap;justify-content:center;align-items:center}
.dot-group{display:grid;grid-template-columns:repeat(5,26px);gap:8px}
.dot-group i{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#FFB3C8,var(--coral-deep));box-shadow:0 0 12px rgba(255,107,147,.5)}
.dot-group.g2 i{background:radial-gradient(circle at 32% 28%,#B9AEFF,#5A48C7);box-shadow:0 0 12px rgba(139,124,246,.5)}
.dot-group i.gone{opacity:.2;box-shadow:none;position:relative}
.dot-group i.gone:after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem;opacity:.7}
.qcount{font-family:'Space Grotesk';color:var(--faint);text-align:center;font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:14px}

/* ---------- finale ---------- */
.finale{text-align:center;padding:40px 16px;animation:rise .8s ease both}
.ring{--p:0;width:190px;height:190px;border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.08) 0);position:relative}
.ring:before{content:'';position:absolute;inset:12px;border-radius:50%;background:var(--bg1)}
.ring b{position:relative;font-family:'Fraunces';font-size:2.6rem;font-weight:900}
.confetti{position:fixed;top:-10px;pointer-events:none;z-index:50;font-size:1.5rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(560deg)}}

/* ---------- parent ---------- */
.tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
.tabs button{padding:11px 20px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:800;color:var(--dim)}
.tabs button.active{background:var(--gold);color:#0B0E23;border-color:var(--gold)}
.stat-row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:16px 0}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:18px}
.stat .n{font-size:1.8rem;font-weight:700;font-family:'Space Grotesk'}
.stat .l{font-size:.74rem;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}
th{font-family:'Space Grotesk';font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.76rem;font-weight:800}
.pill.pass{background:rgba(61,220,151,.16);color:#9FF0CC;border:1px solid rgba(61,220,151,.4)}
.pill.fail{background:rgba(255,122,133,.14);color:#FFC0C6;border:1px solid rgba(255,122,133,.35)}
.money{color:var(--green);font-weight:900}
.paid-btn{background:var(--glass2);border:1px solid var(--line2);border-radius:10px;padding:6px 13px;font-weight:800;font-size:.78rem}
.paid-btn.is-paid{background:rgba(61,220,151,.16);color:#9FF0CC;border-color:rgba(61,220,151,.4)}
.journal-entry{background:var(--glass);border-left:3px solid var(--violet);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.journal-entry .q{font-weight:800;font-size:.9rem;color:#C9C4FF}
.journal-entry .a{margin-top:6px;line-height:1.55}
.hint{font-size:.85rem;color:var(--faint);margin-top:8px;line-height:1.5}
.setup-form label{display:block;font-weight:800;margin:16px 0 7px;font-size:.92rem}
.setup-form input{width:100%;padding:14px 17px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--line2);color:var(--txt)}
.setup-form input:focus{outline:none;border-color:var(--gold)}
.pin-pad{max-width:340px;margin:8vh auto 0;text-align:center}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:20px 0}

.pin-dots span.full{background:var(--gold);border-color:var(--gold);box-shadow:0 0 12px rgba(255,215,106,.6)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.numpad button:active{transform:scale(.94)}
@media(max-width:620px){#app{padding:14px 12px 70px}.pad{padding:20px}.bubble{max-width:88%}.choices,.replybox,.chat-tools{margin-left:0}}

function genMaths14(n){
  const makers=[

    ()=>{const a=R(-9,-2),b=R(3,15);return{q:`${a} + ${b}`,a:[String(a+b)],why:`jump ${b} right from ${a} → ${a+b}`}},
    ()=>{const xx=R(3,12),c=R(2,9);return{q:`solve  x + ${c} = ${xx+c}`,a:[String(xx),'x='+xx],why:`subtract ${c} from both sides → x = ${xx}`}},

 ]},
 {t:'chat',label:'Dialogue I · The mountain shrinks',script:[
  {m:'You heard the podcast. Before we go anywhere — I want to test the *idea*, not you. 🦉'},
  {m:'People say "I\'m just bad at maths, it\'s how I\'m built." A scientist would call that a <strong>claim</strong>. What would a scientist demand next?'},
  {q:'What does every claim need?',opts:[
    {x:'Evidence — can it actually be tested?',r:'Exactly. You think like a scientist already. So let\'s look at the evidence: the "maths mountain" turned out to be 36 facts. Does a 36-item list sound like something only "maths people" can learn?',good:true},
    {x:'Confidence — say it louder',r:'Ha — volume is not evidence! A claim said loudly is still just a claim. What a scientist demands is <strong>evidence</strong>. And the evidence says the mountain is only 36 facts tall.'},
    {x:'A teacher to confirm it',r:'Teachers help, but even teachers must show evidence. And the evidence here is striking: the whole "mountain" is 36 facts. That\'s a shopping list, not a mountain.'}],scored:true},
  {m:'Here\'s a trick hiding inside the 9s. Watch: 9×7 = 63... and 6+3 = 9. Try another: 9×4 = 36... 3+6 = 9. 🤯'},
  {q:'Why do you think I showed you TWO examples instead of one?',opts:[
    {x:'One example could be a fluke — patterns need testing',r:'<em>Yes.</em> That instinct — "show me it again before I believe it" — is the exact instinct that will carry you through GCSEs. The 9s digit-sum pattern holds for every single one.',good:true},
    {x:'To fill time',r:'Never! Every question I ask has a purpose. One example could be a coincidence. Two starts to look like a <strong>pattern</strong> — and patterns can be trusted and used.'}],scored:true},
  {q:'So without calculating from scratch — 9 × 6. Which answer FEELS right using the pattern?',opts:[
    {x:'54 — because 5+4 makes 9',r:'Beautiful reasoning. You didn\'t memorise it — you <strong>derived</strong> it. That\'s the difference between knowing a fact and owning it.',good:true},
    {x:'56 — because it sounds close',r:'Check it against the pattern: 5+6 = 11, not 9. The pattern rejects it! Try 54: 5+4 = 9. ✓ The pattern is a built-in error detector.'},
    {x:'63 — I remember that one',r:'63 is 9×7 — right neighbourhood, wrong house! Use the pattern: which option\'s digits sum to 9? 54. The pattern beats memory.'}],scored:true},
  {probe:'In your own words — why is "I\'m bad at maths" a weak claim? One or two sentences of your best thinking.',r:'I\'m keeping that answer — your grown-up will read it, and honestly, it\'s the most important thing you\'ll write today. Weak claims collapse when you demand evidence. Now let\'s build the muscle. 💪'}
 ]},
 {t:'quickfire',label:'The Forge · prove it under fire',n:6,gen:()=>genMaths14(6),
  intro:'No hints now, explorer — this is where mastery is measured. Six challenges, fresh ones every time you return. Ready?'},
 {t:'chat',label:'Dialogue II · BIDMAS and the lying calculator',script:[
  {m:'One more idea — and this one catches out <em>adults</em>. What is 3 + 4 × 2?'},
  {q:'Trust your gut first:',opts:[
    {x:'14 — left to right',r:'Your gut did what most guts do! But maths has traffic rules: <strong>B</strong>rackets, <strong>I</strong>ndices, <strong>D</strong>ivision-<strong>M</strong>ultiplication, <strong>A</strong>ddition-<strong>S</strong>ubtraction. Multiplication goes first: 4×2=8, then +3 = <strong>11</strong>. Why rules? So every mathematician on Earth gets the same answer.'},
    {x:'11 — multiply first',r:'You already know the traffic rules of maths — BIDMAS. Multiplication before addition: 4×2=8, +3 = 11. The question is... <em>why</em> should maths have rules like this at all?',good:true}],scored:true},
  {q:'Why does maths NEED an agreed order of operations?',opts:[
    {x:'So the same expression means the same thing to everyone, everywhere',r:'That\'s it exactly. Maths is a <strong>universal language</strong> — a bridge in Japan and a bank in Brazil must read 3+4×2 identically, or bridges fall and banks fail. Rules aren\'t there to annoy you; they make the language trustworthy.',good:true},
    {x:'To make school harder',r:'I know it can feel that way! But imagine two engineers reading the same formula differently... and one of them built your lift. 😬 The rules exist so the language means ONE thing everywhere on Earth.'}],scored:true},
  {m:'Final move. Brackets are how you <em>overrule</em> the traffic: (3+4)×2 = 14. Same symbols, different meaning. Brackets are you, seizing control.'},
  {probe:'Invent your own: write a calculation where brackets completely change the answer, and show both answers.',r:'Now you\'re not answering maths questions — you\'re <em>writing</em> them. That\'s what mastery looks like. See you at the summit. 🏔️'}
 ]},
 {t:'reflect',q:'Tonight\'s big question: A friend says "calculators exist, so learning number facts is pointless." Give me your strongest counter-argument — then, to be fair, the strongest point FOR their side. A great thinker can argue both.'}
]},
{id:'w1',em:'🔤',title:'Word Forge',blurb:'Spelling as detective work, vocabulary as power — a conversation about words',scenes:[
 {t:'podcast',ep:'Episode 2 · The Wonder Frequency',title:'Why English Spelling Is a Museum',art:'🔤',lines:[
  {v:'nova',s:'Zed, spell the word knight for me. K night.'},
  {v:'zed',s:'K, N, I, G, H, T. Which is honestly ridiculous. Why the K? Why the G H?'},
  {v:'nova',s:'Because a thousand years ago, people PRONOUNCED them. Kuh-nicht! You were not spelling nonsense — you were hearing a fossil.'},
  {v:'zed',s:'Wait. So weird spellings are like... dinosaur bones inside words?'},
  {v:'nova',s:'Precisely. English is a museum. Every silent letter is an exhibit from the language\'s past. And here is the useful part — museums have maps.'},
  {v:'zed',s:'Meaning... patterns?'},
  {v:'nova',s:'Meaning patterns. Learn a handful of rules and stories, and hundreds of words unlock at once. Separate has A RAT in it. Necessary has one Collar and two Sleeves.'},
  {v:'zed',s:'One C, two S. Okay, that will actually stay in my head forever now.'},
  {v:'nova',s:'That is the trick. Your brain forgets lists but never forgets stories. Today we turn the hardest words in English into stories.'},
  {v:'zed',s:'To the museum!'}
 ]},
 {t:'chat',label:'Dialogue I · The word detective',script:[
  {m:'Let me show you something odd, then you tell me what\'s going on. 🦉'},
  {m:'<strong>stop → stopped</strong> (double P). <strong>begin → beginning</strong> (double N). But <strong>open → opening</strong>... no double. English looks random, doesn\'t it?'},
  {q:'Is it random? Look closely — say them out loud. Where does your voice punch hardest?',opts:[
    {x:'stop and beGIN punch the last bit... OPen punches the first',r:'You just <em>discovered</em> the doubling rule — nobody told you it! When the stress lands on the final syllable, the last letter doubles. You did what linguists do: found the pattern hiding in the noise.',good:true},
    {x:'It\'s random — English just hates us',r:'That\'s the popular theory! But say them aloud: stop, beGIN, OPen. Feel where your voice punches? Stress on the END → double the letter. It was never random — it was waiting for a detective.'}],scored:true},
  {q:'Test your new rule like a scientist: "forget" → forgetting or forgeting?',opts:[
    {x:'forGETting — stress on the end, so double it',r:'The rule holds! You\'ve now got a machine that spells thousands of words for you. That\'s infinitely better than memorising thousands of words.',good:true},
    {x:'forgeting — one T looks tidier',r:'Tidy, but the rule disagrees: we say for-GET — stress on the end — so it doubles: forgetting. Trust the pattern over the eyeball!'}],scored:true},
  {probe:'Your turn to be the mnemonic-maker: invent a memory story for the word "business" (b-u-s-i-n-e-s-s). The sillier the better — silly sticks.',r:'Filed in your journal! A mnemonic you invent yourself is ten times stickier than one you\'re given. That\'s not a spelling trick — that\'s how memory itself works.'}
 ]},
 {t:'spellrun',label:'The Anvil · forge six words',n:6,list:'SPELL14',
  intro:'Now the forge gets hot. I\'ll <em>say</em> each word — you shape it letter by letter. Fresh words every visit. Listen hard.'},
 {t:'chat',label:'Dialogue II · Words as power tools',script:[
  {m:'Last conversation. Read these two sentences:<br><br>1. "The sea slowly wears the land away."<br>2. "The coastline suffers relentless <strong>erosion</strong>."'},
  {q:'Same fact. Which writer sounds like they\'ll get the top GCSE grade — and more importantly, WHY?',opts:[
    {x:'The second — one precise word carries a whole idea',r:'That\'s the secret examiners never quite say out loud. Precise vocabulary isn\'t showing off — it\'s <strong>compression</strong>. One exact word does the work of a sentence, and leaves room for your next idea.',good:true},
    {x:'The first — simpler is always better',r:'Simple is powerful — when it\'s a <em>choice</em>. But notice: "erosion" isn\'t harder, it\'s more <strong>precise</strong>. It tells a geographer exactly which process you mean. Precision is what earns marks.'}],scored:true},
  {q:'A business student writes: "the company\'s <strong>revenue</strong> grew but it wasn\'t <strong>viable</strong>." Decode it — what are they actually saying?',opts:[
    {x:'Money coming in grew, but the business still couldn\'t survive',r:'Perfect decode. Two power words, one sharp sentence. This is your GCSE toolkit: erosion, sustainable, viable, revenue, prototype, entrepreneur. Collect them like a craftsman collects tools.',good:true},
    {x:'The company was doing fine',r:'Look closer — "wasn\'t viable" is the sting in the tail. Revenue (money in) grew, yet the business couldn\'t survive — maybe costs grew faster. Power words let one sentence hold a whole story.'}],scored:true},
  {probe:'Write one sentence about any business or place you know, using TWO of these: erosion, sustainable, viable, revenue, prototype, entrepreneur.',r:'There it is — a sentence a GCSE examiner would underline. Words are the only tools you\'ll carry into every subject, every job, every argument you\'ll ever win. Keep collecting. 🛠️'}
 ]},
 {t:'reflect',q:'The philosopher Wittgenstein said "the limits of my language are the limits of my world." What do you think he meant — and can you think of one example from your own life where learning a new word let you notice something new?'}
]},
{id:'g1',em:'🌋',title:'The Restless Earth',blurb:'A dialogue with a planet that never sits still — GCSE Geography begins',scenes:[
 {t:'podcast',ep:'Episode 3 · The Wonder Frequency',title:'You Are Standing on a Raft',art:'🌍',lines:[
  {v:'nova',s:'Zed. Right now, this second, the ground under your feet is moving.'},
  {v:'zed',s:'It really is not. I am standing in a kitchen.'},
  {v:'nova',s:'Your kitchen rides on a slab of rock thousands of kilometres wide, floating on hot, slowly churning rock beneath. A tectonic plate. And it drifts about as fast as your fingernails grow.'},
  {v:'zed',s:'Fingernail speed. So basically nothing.'},
  {v:'nova',s:'Basically nothing... per year. But nature plays a longer game than we do. Give fingernail-speed two hundred million years and continents cross entire oceans. The Atlantic gets wider while we record this.'},
  {v:'zed',s:'Okay that is genuinely unsettling. So what happens where two of these rafts meet?'},
  {v:'nova',s:'Everything happens. Mountains rise. Volcanoes ignite. Earthquakes tear ground apart. Almost all the planet\'s drama lives at the edges of the plates.'},
  {v:'zed',s:'And people still live there? Next to volcanoes?'},
  {v:'nova',s:'Five hundred million of them. And here is today\'s real question — the GCSE question. Why would half a billion people choose to live beside something that can destroy them?'},
  {v:'zed',s:'When you put it like that... I actually need to know.'}
 ]},
 {t:'chat',label:'Dialogue I · The three meetings',script:[
  {m:'Two colossal rafts of rock, drifting. Sooner or later they meet. 🦉 Before I tell you anything — <em>reason it out</em>. What are the only three things two moving objects can do to each other?'},
  {q:'Think of two cars, two people in a corridor, anything:',opts:[
    {x:'Crash together, pull apart, or slide past each other',r:'You have just derived the whole of plate tectonics from first principles! Geographers give them fancy names — <strong>destructive</strong> (collide), <strong>constructive</strong> (separate), <strong>conservative</strong> (slide past) — but the logic was yours before the labels.',good:true},
    {x:'Only crash — everything crashes eventually',r:'Crashing is one! But picture two people in a corridor: they can collide, yes — but also walk apart, or brush past shoulder-to-shoulder. Three meetings: collide (<strong>destructive</strong>), separate (<strong>constructive</strong>), slide past (<strong>conservative</strong>).'}],scored:true},
  {m:'Now predict like a scientist. At a <strong>constructive</strong> boundary, plates pull APART. That leaves a gap in the crust... above a planet full of molten rock.'},
  {q:'What must happen at the gap?',opts:[
    {x:'Molten rock rises up and hardens — new crust is born',r:'Predicted perfectly. That\'s why it\'s called <em>constructive</em> — the planet is literally building new floor, mostly under the oceans. The Atlantic seafloor is a factory that never closes.',good:true},
    {x:'The gap just stays empty',r:'Could a hole in the crust stay empty with an ocean of molten rock pressing beneath it? It rises, fills the gap, hardens — <strong>new crust is born</strong>. The planet builds its own floor. Constructive!'}],scored:true},
  {q:'The San Andreas Fault in California: two plates <em>sliding past</em> each other, sticking... then jolting free. What does that produce?',opts:[
    {x:'Earthquakes — the jolt IS the quake',r:'Exactly — a conservative boundary. No crust made, none destroyed, but the stick-and-slip releases violent energy. Californians live on a zip that keeps snagging.',good:true},
    {x:'Volcanoes — all boundaries make volcanoes',r:'Reasonable guess — but ask: where would the molten rock escape? No gap opens (that\'s constructive), nothing melts downward (that\'s destructive). Sliding just <em>sticks and snaps</em> — and each snap is an <strong>earthquake</strong>.'}],scored:true},
  {probe:'Close your eyes and describe what a destructive boundary must look like in slow motion — one plate diving beneath another, over millions of years. Paint it in words.',r:'That image you just built — the diving plate melting into magma that fuels volcanoes above — is worth more than any diagram, because you constructed it. It\'s yours now.'}
 ]},
 {t:'chat',label:'Dialogue II · The half-billion question',script:[
  {m:'Now the question the podcast left burning: <strong>500 million people</strong> live near active volcanoes. Your first instinct?'},
  {q:'Be honest:',opts:[
    {x:'They must have good reasons — people usually do',r:'That instinct — <em>assume people have reasons, then find them</em> — is the beginning of all good geography. So let\'s find them.',good:true},
    {x:'They\'re being foolish',r:'Tempting! But here\'s a rule that will serve you for life: when millions of people do something that looks foolish, the foolishness is usually in <em>our understanding</em>, not their choice. Let\'s find their reasons.'}],scored:true},
  {m:'Clue one: farmers near Vesuvius and Etna have prized their land for thousands of years. Clue two: Iceland heats 90% of its homes without burning anything. Clue three: millions visit volcano national parks yearly.'},
  {q:'Assemble the clues — why do people stay?',opts:[
    {x:'Fertile volcanic soil, free geothermal energy, tourism money',r:'The full picture. Volcanic ash weathers into super-fertile soil; the heat below becomes energy; the drama becomes jobs. Every hazard is a <strong>trade-off</strong> — risk weighed against reward. Remember that word: GCSE Geography is built on it.',good:true},
    {x:'They can\'t afford to leave',r:'For some, sadly true — never forget it. But it can\'t be the whole story: wealthy Icelanders and Neapolitans <em>choose</em> to stay. Add the clues: fertile soil, geothermal energy, tourism. Risk versus reward — a <strong>trade-off</strong>.'}],scored:true},
  {q:'Final test of your new thinking. A magnitude 6 quake hits wealthy City A (strict building codes) and poorer City B (unreinforced buildings). Same quake — same damage?',opts:[
    {x:'No — B suffers far more. Preparation matters more than magnitude',r:'You\'ve reached the deepest idea in hazard geography: <em>"earthquakes don\'t kill people — buildings do."</em> Engineering, warnings and emergency services decide the death toll far more than the quake itself. Development is destiny.',good:true},
    {x:'Same quake, same damage — physics is physics',r:'The physics is identical — but physics meets <em>buildings</em>. Reinforced towers sway and survive; unreinforced walls pancake. Geographers say "earthquakes don\'t kill people, buildings do." Preparation rewrites the outcome.'}],scored:true},
  {probe:'Your town is offered a geothermal power station beside a dormant volcano: cheap clean energy, but... you know. Argue BOTH sides in two sentences each, then cast your vote.',r:'Arguing both sides before voting — that\'s not just geography, that\'s intellectual honesty. Socrates would shake your hand. This answer goes to your grown-up. 🗳️'}
 ]},
 {t:'reflect',q:'The Earth destroys and creates with the same forces. Can you think of anything else in life that works that way — where the thing that makes something dangerous is also what makes it valuable?'}
]},
{id:'b1',em:'💡',title:'The Big Idea',blurb:'Business & DT as a conversation: problems, profit, prototypes and people',scenes:[
 {t:'podcast',ep:'Episode 4 · The Wonder Frequency',title:'5,127 Failures',art:'💡',lines:[
  {v:'nova',s:'Zed, I want to tell you about the most successful failure in Britain.'},
  {v:'zed',s:'A successful failure. Go on.'},
  {v:'nova',s:'A man named James Dyson believed vacuum cleaners were badly designed. Bags clogged, suction died. So he built a better one. It did not work.'},
  {v:'zed',s:'Awkward.'},
  {v:'nova',s:'So he built another. Also failed. Another. Failed. Zed — he built five thousand, one hundred and twenty seven prototypes. Fifteen years.'},
  {v:'zed',s:'Five THOUSAND? I would have quit at, generously, nine.'},
  {v:'nova',s:'And here is what separates designers from everyone else. Dyson said he did not see 5,126 failures. He saw 5,126 pieces of information. Each broken prototype told him one more thing that did not work.'},
  {v:'zed',s:'So failure was... data.'},
  {v:'nova',s:'Failure IS data — if you are cheap and fast about it. That is the whole secret of Design and Technology: fail early, fail cheap, learn everything. And the business secret is knowing which failures are worth paying for.'},
  {v:'zed',s:'Prototype 5,127 made him a billionaire, didn\'t it.'},
  {v:'nova',s:'It did. Today: how to think like the man who failed his way to the top.'}
 ]},
 {t:'chat',label:'Dialogue I · The three magic numbers',script:[
  {m:'Every business on Earth — from a lemonade stand to Apple — lives or dies by three numbers. Let\'s see if you can find them. 🦉'},
  {m:'Picture your stand: you sell 50 cups at 5 dhs each. What flows IN?'},
  {q:'Money in:',opts:[
    {x:'250 dhs — that\'s the revenue',r:'50 × 5 = 250 dhs of <strong>revenue</strong>. Number one found. But hold on — is that 250 yours to keep?',good:true},
    {x:'250 dhs — pure profit, spend it!',r:'250 in, yes — but careful with the word "profit"! Who paid for the lemons? The sugar, the cups? Money IN is called <strong>revenue</strong>. What you <em>keep</em> is a different number...'}],scored:true},
  {q:'Your lemons, sugar and cups cost 90 dhs. So what do you actually KEEP — and what should we call it?',opts:[
    {x:'160 dhs — the profit: revenue minus costs',r:'The third magic number: <strong>profit = revenue − costs</strong> = 250 − 90 = 160 dhs. You now understand the equation that runs every company on the planet. Genuinely — that\'s the whole engine.',good:true},
    {x:'250 dhs — the costs were yesterday\'s problem',r:'Ah, the accountant\'s nightmare! 😄 The 90 dhs came out of the same pocket. Keep = revenue − costs = 250 − 90 = <strong>160 dhs profit</strong>. Costs never stop being your problem — ask any entrepreneur.'}],scored:true},
  {q:'Harder. A café takes 8,000 dhs revenue but its costs are 9,200. The owner says "we\'re fine, look at all this money coming in!" What do YOU see?',opts:[
    {x:'A loss of 1,200 dhs — revenue means nothing if costs exceed it',r:'You saw through the revenue illusion — the trap that kills more businesses than any other. Big revenue with bigger costs is just fast-moving failure. Profit is the only number that keeps the lights on.',good:true},
    {x:'The owner\'s right — 8,000 is loads',r:'8,000 sounds grand — until you see 9,200 leaving. That\'s a <strong>1,200 dhs loss</strong> every period. The revenue illusion has sunk giant companies. Always ask: what\'s left after costs?'}],scored:true},
  {probe:'Dyson spent 15 years with zero revenue and endless costs. Was he running a failing business or something else? Defend your answer.',r:'That\'s the deep question — he was <em>investing</em>: paying today for knowledge that becomes profit tomorrow. The line between "losing money" and "investing" is one of the great judgement calls in business. You just made your first one.'}
 ]},
 {t:'chat',label:'Dialogue II · Design is choosing for someone',script:[
  {m:'Now the DT half of the brain. I\'ll give you a design brief and <em>no other information</em>: "Design a water bottle."'},
  {q:'Can you actually start designing?',opts:[
    {x:'No — designed for WHOM? Everything depends on the user',r:'You\'ve found the first commandment of design: <strong>know your user</strong>. A bottle for toddlers (unbreakable, no small parts) and a bottle for mountaineers (featherweight, insulated, clip-on) share almost nothing. The user is called your <strong>target market</strong>, and they decide everything.',good:true},
    {x:'Sure — a bottle\'s a bottle',r:'Then whose bottle? A toddler needs unbreakable and chunky. A mountaineer needs featherweight and insulated. A commuter needs cup-holder-sized. "A bottle\'s a bottle" designs for nobody. The <strong>target market</strong> — the specific user — decides everything.'}],scored:true},
  {q:'You\'re designing headphones for elderly users. Premium titanium would be gorgeous — but it doubles the price beyond what they\'ll pay. The design-thinking move is:',opts:[
    {x:'Choose the cheaper material — a product your market can\'t afford serves no one',r:'That\'s a real designer\'s trade-off: function, cost, user and price in constant negotiation. "Best material" is meaningless — only <em>best for this user at this price</em> exists. Dyson would approve.',good:true},
    {x:'Titanium — always use the best material',r:'Here\'s the twist: "best" for whom? A gorgeous product your target market can\'t afford is a <em>failed</em> product. Design is negotiation — function, cost, user, price. The cheaper material that reaches its user beats the premium one that doesn\'t.'}],scored:true},
  {q:'Why did Dyson build prototype #1 out of cardboard and tape rather than steel?',opts:[
    {x:'Finding a flaw in cardboard costs pennies; finding it in steel costs a fortune',r:'<strong>Fail early, fail cheap, learn everything.</strong> A flaw discovered in cardboard costs an afternoon. The same flaw in 10,000 manufactured units is a catastrophe. Prototyping is buying knowledge at a discount.',good:true},
    {x:'He couldn\'t afford steel',r:'Money was tight — but that\'s not the deep reason. Even rich companies prototype in cardboard first. A flaw found in cardboard costs pennies to fix; in 10,000 steel units, a fortune. <strong>Prototypes buy knowledge cheaply.</strong>'}],scored:true},
  {probe:'Entrepreneur challenge: name one genuine annoyance in your home, invent a product that fixes it, name its target market, and set a price. Four sentences of business genius, please.',r:'Filed with the investors (your parents 😄). Notice what you just did: problem → solution → user → price. That chain of thought IS a business plan. Every company you\'ve ever heard of started with exactly that sentence.'}
 ]},
 {t:'quickfire',label:'The Ledger · profit under pressure',n:5,gen:()=>[
   (()=>{const u=R(20,60),p=R(5,15),c=R(50,300);const rev=u*p;return{q:`${u} items sold at ${p} dhs each. Costs ${c} dhs. PROFIT in dhs?`,a:[String(rev-c)],why:`revenue ${rev} − costs ${c} = ${rev-c}`}})(),
   ...genMaths14(4)
 ],intro:'A real entrepreneur calculates fast. Five challenges — profits and the number skills beneath them.'},
 {t:'reflect',q:'"Fail early, fail cheap, learn everything." Where else in your life could you apply Dyson\'s rule — school, sport, friendships? Give one concrete example of a cheap, fast "prototype" you could try this month.'}
]},
{id:'al14',em:'🔓',title:'Algebra Unlocked',blurb:'The moment letters stop being scary and become the most powerful tool in maths',scenes:[
 {t:'podcast',ep:'Episode 5 · The Wonder Frequency',title:'The Letter That Holds a Secret',art:'🔓',lines:[
  {v:'nova',s:'Zed, I am thinking of a number. If I add three to it, I get ten. What is my number?'},
  {v:'zed',s:'Seven, obviously. Ten take away three.'},
  {v:'nova',s:'You just did algebra. Actual algebra. The kind people say they cannot do.'},
  {v:'zed',s:'No I did not, I just... worked it out backwards.'},
  {v:'nova',s:'That IS algebra. Mathematicians simply write your mystery number as a letter — x — so they can talk about it before they know it. x plus three equals ten.'},
  {v:'zed',s:'So x is just... the number I do not know yet? A box with a question mark?'},
  {v:'nova',s:'A box with a question mark. That is the whole idea. Every terrifying equation is just a puzzle asking, what is hiding in the box?'},
  {v:'zed',s:'Why did nobody ever tell me it was that simple?'},
  {v:'nova',s:'Because x looks frightening and boxes do not. Today we swap the fear for the box, and suddenly you can solve for anything.'},
  {v:'zed',s:'Open the box. Let us go.'}
 ]},
 {t:'chat',label:'Dialogue · The balancing scales',script:[
  {m:'Here is the one secret that unlocks every equation. 🦉 Picture an old-fashioned pair of scales, perfectly balanced. On the left: <strong>x + 3</strong>. On the right: <strong>10</strong>. They balance.'},
  {q:'If I lift 3 off the LEFT pan, what must I do to keep the scales balanced?',opts:[
    {x:'Take 3 off the right pan too',r:'That is the golden rule of algebra: <strong>whatever you do to one side, you must do to the other.</strong> Take 3 from both: left becomes x, right becomes 7. So x = 7. You did not "move the 3 over" — you kept the scales fair.',good:true},
    {x:'Add 3 to the right pan',r:'Careful — if you remove from the left but add to the right, the scales tip over! The rule is: do the <em>same</em> to both. Remove 3 from each. Left = x, right = 7. Balance keeps the truth.'}],scored:true},
  {q:'Now a trickier scale: <strong>2x = 12</strong>. Two identical boxes together weigh 12. What is in ONE box?',opts:[
    {x:'6 — split the 12 between the two boxes',r:'Exactly — divide both sides by 2. If two equal boxes make 12, each holds 6. You are now doing what most people think only "maths people" can. It was always just fair sharing.',good:true},
    {x:'10 — take 2 away from 12',r:'Watch the operation: the boxes are <em>multiplied</em> by 2 (two of them), not added to. So you <em>divide</em> by 2, not subtract. 12 ÷ 2 = 6 in each box. Match the undo to the do!'}],scored:true},
  {q:'Why do you think algebra is worth learning at all — what does a letter give you that a number cannot?',opts:[
    {x:'A letter can stand for ANY number — so one formula works forever',r:'You have grasped the real power. "Area = length × width" solves every rectangle that will ever exist. Algebra is how we write a truth <em>once</em> and use it a million times. That is why it runs science, money and engineering.',good:true},
    {x:'It just makes maths look cleverer',r:'It can look that way — but here is the magic: a letter stands for <em>any</em> number, so one formula like "distance = speed × time" works for every journey ever taken. Algebra lets you write a rule once and reuse it forever.'}],scored:true},
  {probe:'In your own words: explain the "golden rule" of solving equations to someone who has never seen an x. Use the scales if it helps.',r:'Teaching the balance rule in your own words means you own it now — this goes to your grown-up. Time to solve some for real. ⚖️'}
 ]},
 {t:'quickfire',label:'The Forge · solve for x',n:6,intro:'Six equations. Find what is hiding in the box. Type just the number, or "x=..." — either works. Fresh puzzles every visit.',
  gen:()=>{const mk=[
   ()=>{const x=R(3,14),c=R(2,9);return{q:`solve  x + ${c} = ${x+c}`,a:[String(x),'x='+x],why:`take ${c} from both sides → x = ${x}`}},
   ()=>{const x=R(4,12),c=R(2,9);return{q:`solve  x − ${c} = ${x-c}`,a:[String(x),'x='+x],why:`add ${c} to both sides → x = ${x}`}},
   ()=>{const x=R(2,9),m=R(2,6);return{q:`solve  ${m}x = ${m*x}`,a:[String(x),'x='+x],why:`divide both sides by ${m} → x = ${x}`}},
   ()=>{const x=R(2,8),m=R(2,5),c=R(1,9);return{q:`solve  ${m}x + ${c} = ${m*x+c}`,a:[String(x),'x='+x],why:`take ${c}, then ÷${m} → x = ${x}`}},
   ()=>{const a=R(2,6),b=R(2,6);return{q:`simplify  ${a}x + ${b}x`,a:[(a+b)+'x'],why:`${a}+${b} = ${a+b}, so ${a+b}x`}},
   ()=>{const x=R(3,9);return{q:`if x = ${x},  find  2x + 3`,a:[String(2*x+3)],why:`2×${x} + 3 = ${2*x+3}`}}
  ];return shuffle(mk).map(f=>f());}
 },
 {t:'reflect',q:'Algebra lets us describe a rule that is true for every number at once. If you could write one "formula" for something in real life — friendship, fairness, a good day — what would go in it? Have fun with this one.'}
]},
{id:'fd14',em:'🎭',title:'Three Coats, One Number',blurb:'Fractions, decimals and percentages are the same idea in three disguises — master the costume change',scenes:[
 {t:'podcast',ep:'Episode 6 · The Wonder Frequency',title:'The Number With Three Outfits',art:'🎭',lines:[
  {v:'nova',s:'Zed, quick. Which is bigger: a half, or nought point five?'},
  {v:'zed',s:'Trick question. They are the same.'},
  {v:'nova',s:'And fifty percent?'},
  {v:'zed',s:'Also the same! Okay, where is this going?'},
  {v:'nova',s:'Here is where. Half of everyone who fears maths fears fractions, AND decimals, AND percentages — as three separate monsters. But they are ONE monster wearing three coats.'},
  {v:'zed',s:'So if I can beat one, I beat all three?'},
  {v:'nova',s:'If you can change the coat at will, yes. A shop says twenty five percent off. Your brain whispers, that is a quarter, that is divide by four. Suddenly a scary sign is an easy sum.'},
  {v:'zed',s:'So the trick is not memorising three things. It is knowing they are one thing.'},
  {v:'nova',s:'That is the entire secret of this topic, and most people never hear it. Today, you learn the costume change.'},
  {v:'zed',s:'Show me the wardrobe.'}
 ]},
 {t:'chat',label:'Dialogue · The costume change',script:[
  {m:'Let us prove they are one number. 🦉 A pizza cut into 4, you eat 1 slice. As a fraction that is one quarter. Now — what does "per cent" literally mean? Break the word: "per" ... "cent"...',},
  {q:'"Cent" shows up in century, centipede, cent. So per-cent means...?',opts:[
    {x:'Per hundred — out of 100',r:'Exactly! Percent = "out of 100". So to turn any fraction into a percentage, you ask: how many would this be out of 100? A quarter out of 100 is 25 — so 25%. The word itself was the instruction all along.',good:true},
    {x:'Per piece',r:'Close thinking, but look at the cousins: <em>cent</em>ury (100 years), <em>cent</em>ipede (100 legs), a <em>cent</em> (1/100 of a dollar). "Per cent" means <strong>per hundred</strong> — out of 100. That is the key to the whole costume change.'}],scored:true},
  {q:'So which of these is the ODD ONE OUT — not equal to the other two? ½ · 0.5 · 25%',opts:[
    {x:'25% — the other two are both a half, but 25% is a quarter',r:'Sharp eyes! ½ = 0.5 = 50%. But 25% = ¼ = 0.25. You spotted the imposter by translating them all into the same coat. That is exactly the skill that makes this topic easy.',good:true},
    {x:'0.5 — decimals are different',r:'Translate them: ½ means 1÷2 = 0.5, and that is 50%. So ½, 0.5 and 50% are triplets. The odd one out is <strong>25%</strong> — that is a quarter, not a half. Same-coat translation catches the imposter.'}],scored:true},
  {q:'Real life: a 60 dhs game has "25% off". You know 25% is a quarter. Fastest route to the saving?',opts:[
    {x:'Divide 60 by 4 = 15 dhs off, so it costs 45',r:'That is the power move — you swapped the scary percentage for an easy fraction and did it in your head. 60 ÷ 4 = 15 off, pay 45. Shops are full of people reaching for calculators while you just... know.',good:true},
    {x:'Multiply 60 by 25',r:'That would give 1500 — far more than the game costs! The trick: 25% <em>is</em> a quarter, so <em>divide</em> by 4. 60 ÷ 4 = 15 off. Changing the coat turned a hard sum into an easy one.'}],scored:true},
  {probe:'Explain to a friend why 0.75, three-quarters, and 75% are all the same number. Convince them.',r:'A clear explanation of why they are one number — that is mastery, not memorisation. Saved for your grown-up. Now prove it under fire. 🎯'}
 ]},
 {t:'quickfire',label:'The Wardrobe · change the coats',n:6,intro:'Switch between fractions, decimals and percentages at speed. Six challenges, fresh each visit.',
  gen:()=>{const mk=[
   ()=>{const f=pick([['1/2','50'],['1/4','25'],['3/4','75'],['1/5','20'],['1/10','10'],['2/5','40']]);return{q:`${f[0]} as a percentage (just the number)`,a:[f[1],f[1]+'%'],why:`${f[0]} = ${f[1]}%`}},
   ()=>{const f=pick([['1/2','0.5'],['1/4','0.25'],['3/4','0.75'],['1/5','0.2'],['1/10','0.1']]);return{q:`${f[0]} as a decimal`,a:[f[1]],why:`${f[0]} = ${f[1]}`}},
   ()=>{const w=pick([40,60,80,20,200,120]),p=pick([10,25,50,20,5]);return{q:`${p}% of ${w}`,a:[String(w*p/100)],why:`${p}% of ${w} = ${w*p/100}`}},
   ()=>{const w=pick([20,40,60,80,100]);return{q:`25% of ${w}  (think: a quarter)`,a:[String(w/4)],why:`${w} ÷ 4 = ${w/4}`}},
   ()=>{const d=pick([['0.5','50'],['0.25','25'],['0.1','10'],['0.2','20'],['0.75','75']]);return{q:`${d[0]} as a percentage (number only)`,a:[d[1],d[1]+'%'],why:`${d[0]} = ${d[1]}%`}},
   ()=>{const w=pick([50,60,80,100,120]);return{q:`10% of ${w}`,a:[String(w/10)],why:`10% just moves the digits: ${w/10}`}}
  ];return shuffle(mk).map(f=>f());}
 },
 {t:'reflect',q:'Shops love writing "25% off" instead of "a quarter off". Why do you think that is — and now that you can translate instantly, does that change how you feel walking past a sale?'}
]},
{id:'lw14',em:'🌳',title:'The Living World',blurb:'GCSE Geography: ecosystems, rainforests, and the delicate web that holds it all together',scenes:[
 {t:'podcast',ep:'Episode 7 · The Wonder Frequency',title:'Pull One Thread',art:'🌳',lines:[
  {v:'nova',s:'Zed, imagine a spider web with a hundred threads. I cut just one. What happens?'},
  {v:'zed',s:'Not much? It is only one thread out of a hundred.'},
  {v:'nova',s:'Cut another. And another. At some point...'},
  {v:'zed',s:'The whole web collapses. Oh. Even though each single thread felt unimportant.'},
  {v:'nova',s:'That is an ecosystem. Every living thing is a thread — the trees, the insects, the fungi, the big cats. Pull enough threads and the whole web falls, all at once.'},
  {v:'zed',s:'So when people say "it is just one species of frog"...'},
  {v:'nova',s:'They are looking at one thread and missing the web. In a rainforest, that frog might be the only thing eating an insect that would otherwise strip a tree that shelters a hundred other species.'},
  {v:'zed',s:'Everything is connected to everything.'},
  {v:'nova',s:'That is the first law of the living world, and the heart of GCSE Geography. Today we walk into the richest web on Earth — the rainforest — and learn to see the threads.'},
  {v:'zed',s:'Into the jungle.'}
 ]},
 {t:'chat',label:'Dialogue I · The web of life',script:[
  {m:'Every ecosystem runs on a flow of energy. 🦉 It all starts with one source. A plant needs it, an animal cannot make food without eating. What is the original power source for almost all life on Earth?',},
  {q:'Trace it back to the very start:',opts:[
    {x:'The Sun — plants capture sunlight, everything else eats plants',r:'The whole web hangs from sunlight. Plants (the "producers") trap the Sun\'s energy; plant-eaters take it second-hand; meat-eaters third-hand. Follow any animal\'s dinner back far enough and you reach the Sun. That chain is called a <strong>food chain</strong>.',good:true},
    {x:'The soil — everything grows from soil',r:'Soil matters for water and nutrients — but it holds no <em>energy</em> a plant can eat. The original power source is the <strong>Sun</strong>: plants capture its light, and every creature that eats is passing that solar energy along a <strong>food chain</strong>.'}],scored:true},
  {q:'Now the key idea. If a disease wiped out ALL the insects in a patch of rainforest, predict the knock-on effects.',opts:[
    {x:'Insect-eaters starve, un-pollinated plants fail, the web unravels',r:'You reasoned like an ecologist — following the threads. No insects means no food for frogs and birds, no pollination for many plants, no decomposers for the soil. One missing group topples dozens. That fragile connectedness is why rainforests are so precious.',good:true},
    {x:'Nothing much — insects are tiny',r:'Tiny, but load-bearing! Remove the insects and: frogs and birds lose their food, flowers lose their pollinators, dead matter stops rotting into soil. Pull that thread and the web unravels. Size is not the same as importance in an ecosystem.'}],scored:true},
  {probe:'Describe, in your own words, what "everything is connected" means in a rainforest — give one example of a chain reaction from a single change.',r:'That chain-reaction thinking is the exact skill GCSE examiners reward. Saved for your grown-up. Now — why should someone in Britain care about a forest thousands of miles away? 🌍'}
 ]},
 {t:'chat',label:'Dialogue II · Why the rainforest matters to you',script:[
  {m:'Rainforests are being cut down for timber, farmland and cattle. A fair question: why should that bother someone living far away in the UK?'},
  {q:'Rainforests are sometimes called "the lungs of the planet". What might that nickname be pointing at?',opts:[
    {x:'They produce oxygen and absorb carbon dioxide — they help everyone breathe and cool the planet',r:'Precisely. Through photosynthesis they lock away vast amounts of carbon dioxide (which warms the planet) and release oxygen. Burn or fell them and that stored carbon escapes — so a forest in Brazil is quietly shaping the climate in Britain. Distance is an illusion here.',good:true},
    {x:'They are shaped like lungs from above',r:'It is not about the shape — it is about the <em>function</em>. Rainforests breathe <em>for</em> the planet: soaking up carbon dioxide, giving out oxygen. Destroy them and stored carbon floods the air, warming everyone\'s climate — including Britain\'s. That is why "lungs" fits.'}],scored:true},
  {q:'A poorer country says "the rich world cut down ITS forests to get wealthy — why can\'t we?" What does a fair-minded geographer recognise here?',opts:[
    {x:'It is a genuine dilemma — development is a real need, but so is protecting a global resource',r:'That is intellectual honesty. Deforestation isn\'t simple villains and heroes: families need income, nations need to develop, yet the forest belongs, in a sense, to all of us. GCSE Geography rewards students who hold both truths — this is a <strong>sustainability</strong> trade-off with no easy answer.',good:true},
    {x:'They are simply wrong to cut it down',r:'Be careful of the easy verdict. That country watched wealthier nations clear their own forests to grow rich — the request isn\'t unreasonable. The real answer is a hard <strong>trade-off</strong>: development versus a resource the whole world depends on. Holding both sides is the mark of a strong geographer.'}],scored:true},
  {probe:'You advise a government that owns rainforest. Suggest ONE way they could earn income WITHOUT destroying the forest. Think creatively.',r:'Ecotourism, sustainable harvesting, carbon credits, research — whatever you proposed, you just did the work of real-world geography: finding the win-win inside a trade-off. Excellent. Saved for your grown-up. 🌱'}
 ]},
 {t:'reflect',q:'The spider-web idea — that small, unnoticed things can be holding up the whole structure — appears far beyond rainforests. Can you spot a "load-bearing thread" in your own school, family or friendship group that people might overlook?'}
]},
{id:'uw14',em:'🏙️',title:'The Urban World',blurb:'GCSE Geography: why half the planet now lives in cities, and what that means',scenes:[
 {t:'podcast',ep:'Episode 8 · The Wonder Frequency',title:'The Great Migration',art:'🏙️',lines:[
  {v:'nova',s:'Zed, for the first time in all of human history, more people now live in cities than in the countryside. That tipping point happened in your lifetime.'},
  {v:'zed',s:'Really? Half the entire planet, in cities?'},
  {v:'nova',s:'And climbing. Every week, roughly three million people move into the world\'s cities. Three million. Every week.'},
  {v:'zed',s:'Why though? What is pulling everyone in?'},
  {v:'nova',s:'That is the exact question. Geographers split it in two. Things PUSHING people out of the countryside — no jobs, poor harvests, few hospitals. And things PULLING them toward cities — work, schools, hospitals, hope.'},
  {v:'zed',s:'Push and pull. So it is not one reason, it is a tug of war.'},
  {v:'nova',s:'A tug of war playing out for billions of people. And when a city grows that fast, wonderful and terrible things happen at once — opportunity and overcrowding, wealth and slums, side by side.'},
  {v:'zed',s:'How can the same city be the best and worst thing at the same time?'},
  {v:'nova',s:'That is today\'s journey. Welcome to the urban world.'}
 ]},
 {t:'chat',label:'Dialogue I · Push and pull',script:[
  {m:'Let us understand why cities explode in size. 🦉 Geographers use two forces: <strong>push</strong> factors (reasons to leave the countryside) and <strong>pull</strong> factors (reasons to head for the city).'},
  {q:'A young farmer\'s crops fail two years running and the nearest hospital is a day\'s walk away. Are those PUSH or PULL factors?',opts:[
    {x:'Push — they drive people AWAY from the countryside',r:'Exactly — hardships that push people out: failing farms, no healthcare, few jobs. Push factors are about what is going <em>wrong</em> where you are. Now, what would <em>pull</em> that same farmer toward the city?',good:true},
    {x:'Pull — they attract people to cities',r:'Look at the direction: failed crops and distant hospitals are problems <em>where the farmer already lives</em> — they <strong>push</strong> him away. Pull factors are the city\'s attractions. Push is what is wrong at home; pull is what glitters elsewhere.'}],scored:true},
  {q:'The same farmer hears the city has factory jobs, schools and electricity. What\'s the deeper truth about why people migrate?',opts:[
    {x:'People move toward a better life — it is usually a rational hope, not foolishness',r:'That is the compassionate and correct reading. Migration is rarely reckless — it is a family weighing a hard present against a hopeful future. Understanding <em>why</em> people move, without judging them, is the beginning of good human geography.',good:true},
    {x:'People are just chasing bright lights',r:'It can look like that from outside — but factory wages, a school for the children, a hospital that is reachable? Those are <em>rational</em> hopes for a better life. Geographers explain migration with empathy, not judgement.'}],scored:true},
  {probe:'List one push factor and one pull factor that you think would be the STRONGEST for a family deciding whether to move to a city. Explain your choice.',r:'Weighing which factors matter most — that is analysis, not just listing, and it is what lifts a GCSE answer. Saved for your grown-up. But when millions arrive at once... what happens to the city? 🏗️'}
 ]},
 {t:'chat',label:'Dialogue II · The two-faced city',script:[
  {m:'A city gaining a million people a year cannot build homes and pipes fast enough. So newcomers often build their own housing on the edges — squatter settlements, or slums.'},
  {q:'It is tempting to see a slum as simply a tragedy. But look closer — what does a self-built settlement also reveal about the people in it?',opts:[
    {x:'Extraordinary resourcefulness — people building lives from almost nothing',r:'A rare and valuable insight. Slums show real hardship, yes — but also astonishing human ingenuity: communities creating homes, businesses and networks with almost no help. Geographers hold both truths, and many of these areas slowly transform into thriving neighbourhoods.',good:true},
    {x:'Only misery and failure',r:'The hardship is real — never dismiss it. But look again: people are <em>building homes and businesses from nothing</em>, organising, trading, surviving. That is extraordinary resourcefulness. The honest picture holds struggle and ingenuity together.'}],scored:true},
  {q:'A city government has limited money. Bulldoze the slums, or invest in improving them (water, power, legal ownership)? What does the evidence favour?',opts:[
    {x:'Improving them — bulldozing just moves the problem and destroys communities',r:'That is what decades of evidence show: "site and service" upgrades — giving people clean water, electricity and legal land rights — turn fragile settlements into stable neighbourhoods far more cheaply than demolition. You reasoned from consequences, like a policy-maker.',good:true},
    {x:'Bulldoze them — start fresh',r:'It sounds decisive, but where do a million displaced people go? They rebuild elsewhere — the problem just moves. The evidence favours <em>improving</em> settlements: water, power, legal ownership. Cheaper, and it preserves the communities people built. Think consequences.'}],scored:true},
  {probe:'A city is both the richest and poorest place a person might live. Why do you think extreme wealth and extreme poverty so often sit side by side in fast-growing cities?',r:'Wrestling with that paradox is real geographical thinking — inequality is one of the defining themes of the urban world. Superb. Saved for your grown-up. 🌆'}
 ]},
 {t:'reflect',q:'Three million people join the world\'s cities every week. If you were designing a brand-new city from scratch to welcome them, what is the ONE thing you would make sure to get right — and why that one above all others?'}
]},
{id:'mk14',em:'🎯',title:'Know Your Customer',blurb:'GCSE Business: marketing is not tricking people — it is understanding them',scenes:[
 {t:'podcast',ep:'Episode 9 · The Wonder Frequency',title:'The Best Product That Nobody Bought',art:'🎯',lines:[
  {v:'nova',s:'Zed, here is a business riddle. A company builds a genuinely better product than anyone else. Better in every way. And it goes bust. How?'},
  {v:'zed',s:'That makes no sense. If it is the best, people should buy it.'},
  {v:'nova',s:'Should they? What if nobody had ever heard of it? What if it sat on a shelf where its perfect customer never looked? What if it was priced for millionaires but built for students?'},
  {v:'zed',s:'Oh. So being the best is not enough on its own.'},
  {v:'nova',s:'Being the best is worthless if the right person never finds it, at the right price, in the right place. That entire problem has a name.'},
  {v:'zed',s:'Marketing?'},
  {v:'nova',s:'Marketing. And most people think marketing means adverts and tricking people. It does not. Real marketing starts with a much deeper question: who exactly is this for, and what do THEY actually want?'},
  {v:'zed',s:'So it is less about shouting and more about... listening?'},
  {v:'nova',s:'Now you sound like someone who could run a business. Today: how great companies understand their customer better than the customer understands themselves.'}
 ]},
 {t:'chat',label:'Dialogue · The four Ps',script:[
  {m:'Marketers boil the whole job down to four ingredients — the "four Ps". 🦉 Product, Price, Place, Promotion. Let us build them by reasoning. First: you have invented a fantastic new trainer. Before anything else, what must you decide?'},
  {q:'The very first P:',opts:[
    {x:'Product — exactly what it is and who it is for',r:'Yes — <strong>Product</strong> comes first: what is it, and crucially, <em>who is it for</em>? A trainer for marathon runners and one for fashion-conscious teens are different products even if both are shoes. Everything else flows from this. Next: how much?',good:true},
    {x:'Promotion — start advertising immediately',r:'Advertising a thing you have not defined yet? You would not know what to say! The first P is <strong>Product</strong>: what it is and who it is for. Only once you know that can you sensibly price, place and promote it.'}],scored:true},
  {q:'Now <strong>Price</strong>. Your trainer costs 80 dhs to make. A rival sells similar ones at 200. Where might you price yours, and why is this a strategic choice, not just a number?',opts:[
    {x:'It depends on the image — a low price says "value", a high price says "premium"',r:'Exactly the strategic insight. Price is a <em>message</em>. Too cheap and buyers suspect poor quality; too dear and they walk away. Price tells the customer what kind of product this is before they even try it. It is psychology as much as maths.',good:true},
    {x:'Always as cheap as possible to win',r:'Careful — the cheapest option often signals "low quality" and can destroy a premium brand. Price is a <strong>message</strong>, not just a number. Sometimes a <em>higher</em> price sells more, by signalling quality. It is a strategic choice about image.'}],scored:true},
  {q:'<strong>Place</strong> means where it is sold. Your trainer targets luxury buyers. Which "place" fits — and what does this teach about Place generally?',opts:[
    {x:'An exclusive boutique, not a pound shop — Place must match the customer',r:'Perfect. Place is about meeting your customer where <em>they</em> already are. Luxury buyers in a bargain bin feels wrong; students in a boutique they cannot afford, pointless. Each P must agree with the others and with the customer.',good:true},
    {x:'Everywhere possible — more shops, more sales',r:'It seems logical, but a luxury trainer in a pound shop destroys its image, and a budget one in an exclusive boutique won\'t sell. <strong>Place</strong> must match the customer. The four Ps only work when they all point at the <em>same</em> person.'}],scored:true},
  {probe:'Pick a product you own. Describe its target customer, then suggest one Price, one Place and one Promotion idea that would all suit that same customer.',r:'Making all four Ps point at one customer — that is the core skill of GCSE marketing, and you just did it. Saved for the investors. Now, some quick business maths. 💹'}
 ]},
 {t:'quickfire',label:'The Boardroom · numbers under pressure',n:5,intro:'Marketing lives or dies by numbers too. Five challenges — profit, pricing and the maths beneath them.',
  gen:()=>{const mk=[
   ()=>{const u=R(20,80),p=R(6,20),c=R(80,400);const rev=u*p;return{q:`Sell ${u} units at ${p} dhs each. Costs ${c} dhs. Profit?`,a:[String(rev-c)],why:`revenue ${rev} − costs ${c} = ${rev-c}`}},
   ()=>{const cost=pick([40,50,80,120]),m=pick([25,50,100]);const price=cost+cost*m/100;return{q:`An item costs ${cost} dhs to make. Add a ${m}% mark-up. Selling price?`,a:[String(price)],why:`${m}% of ${cost} = ${cost*m/100}; ${cost} + ${cost*m/100} = ${price}`}},
   ()=>{const w=pick([200,400,600,800]),p=pick([10,25,5,20]);return{q:`${p}% of ${w} customers came back. How many is that?`,a:[String(w*p/100)],why:`${p}% of ${w} = ${w*p/100}`}},
   ()=>{const a=R(3,12),b=R(3,12);return{q:`${a} shops each sell ${b} units. Total units?`,a:[String(a*b)],why:`${a} × ${b} = ${a*b}`}},
